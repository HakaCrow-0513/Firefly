    }

    /* ⑤ 落位：根精确在原点。无横向拉伸、无整体旋转、无包围盒归一化。 */

    /* ⑥ 落位：根精确在原点 */
    var minPair = Infinity, minA = '', minB = '';
    POS.clear();
    NODES.forEach(function (n, idx) {
      var o = NS[idx];
      var vx = Math.round(o.x * 100) / 100, vy = Math.round(o.y * 100) / 100;
      if (vx === 0) vx = 0; if (vy === 0) vy = 0;
      POS.set(n.id, { x: vx, y: vy });
    });
    for (i = 0; i < N; i++) {
      var PA = POS.get(NS[i].id);
      for (j = i + 1; j < N; j++) {
        var PB = POS.get(NS[j].id);
        var pdx = PA.x - PB.x, pdy = PA.y - PB.y;
        var pd = Math.sqrt(pdx * pdx + pdy * pdy);
        if (pd < minPair) { minPair = pd; minA = NS[i].id; minB = NS[j].id; }
      }
    }

    /* ⑦ 支链不穿插：同层按角度排序，相邻但属于不同一级支链的节点之间最小角差（度） */
    var l1Of = new Map();
    function l1RootOf(id) {
      if (l1Of.has(id)) return l1Of.get(id);
      var cur = id, g2 = 0;
      while (parentOf.has(cur) && parentOf.get(cur) !== ROOT_ID && g2++ < 64) cur = parentOf.get(cur);
      var v = (parentOf.get(cur) === ROOT_ID) ? cur : ROOT_ID;
      l1Of.set(id, v); return v;
    }
    var minGap = Infinity, minGapAt = '', minGapLv = 0, l1Angles = [];
    for (var lv2 = 0; lv2 <= MAX_LEVEL; lv2++) {
      var arr = [];
      NS.forEach(function (o) {
        if (o.lv !== lv2) return;
        arr.push({ id: o.id, a: Math.atan2(POS.get(o.id).y, POS.get(o.id).x), br: l1RootOf(o.id) });
      });
      arr.sort(function (p1, p2) { return p1.a - p2.a; });
      if (lv2 === 1) l1Angles = arr.map(function (o) { return o.a; });
      for (var t3 = 1; t3 < arr.length; t3++) {
        if (arr[t3].br === arr[t3 - 1].br) continue;
        var gd = (arr[t3].a - arr[t3 - 1].a) * 180 / Math.PI;
        if (gd < minGap) { minGap = gd; minGapAt = NS[IX.get(arr[t3].id)].id; minGapLv = lv2; }
      }
    }
    var l1Min = Infinity;
    for (var t4 = 1; t4 < l1Angles.length; t4++) {
      var dg = (l1Angles[t4] - l1Angles[t4 - 1]) * 180 / Math.PI;
      if (dg < l1Min) l1Min = dg;
    }
    var maxR = 0;
    POS.forEach(function (p2) { var rr = Math.sqrt(p2.x * p2.x + p2.y * p2.y); if (rr > maxR) maxR = rr; });

    /* ⑧ 边界（只统计，不夹取） */
    var bminX = Infinity, bminY = Infinity, bmaxX = -Infinity, bmaxY = -Infinity;
    POS.forEach(function (p3) {
      if (p3.x < bminX) bminX = p3.x; if (p3.x > bmaxX) bmaxX = p3.x;
      if (p3.y < bminY) bminY = p3.y; if (p3.y > bmaxY) bmaxY = p3.y;
    });
    /* 参照框 = 节点包围盒外扩一个碰撞直径(LAYOUT_MIN_D)：极值点必然贴着紧包围盒，
       要判断「有没有被边界夹住」必须看更外一圈，否则任何布局都会「贴边」。 */
    var PAD = LAYOUT_MIN_D;
    var pminX = bminX - PAD, pminY = bminY - PAD, pmaxX = bmaxX + PAD, pmaxY = bmaxY + PAD;
    var pw = pmaxX - pminX, ph = pmaxY - pminY, onPadded = 0, tl = 0, tr2 = 0, tt = 0, tb = 0;
    POS.forEach(function (p4) {
      var inL = pw > 0 && (p4.x - pminX) / pw <= 0.01;
      var inR = pw > 0 && (pmaxX - p4.x) / pw <= 0.01;
      var inT = ph > 0 && (p4.y - pminY) / ph <= 0.01;
      var inB = ph > 0 && (pmaxY - p4.y) / ph <= 0.01;
      if (inL) tl++; if (inR) tr2++; if (inT) tt++; if (inB) tb++;
      if (inL || inR || inT || inB) onPadded++;
    });

    var st = layoutMetrics('radial', t0, FREE_ITERS, drift);
    st.mode = 'radial';
    st.boundary = { pad: PAD, bandX: Math.round(pw * 0.01 * 10) / 10, bandY: Math.round(ph * 0.01 * 10) / 10, onPadded: onPadded, side: { l: tl, r: tr2, t: tt, b: tb }, tight: { left: Math.round(bminX * 10) / 10, right: Math.round(bmaxX * 10) / 10, top: Math.round(bminY * 10) / 10, bottom: Math.round(bmaxY * 10) / 10 } };
    st.frozen = { maxRun: maxZero, count: frozenCount, rootExempt: ROOTIX >= 0 };
    st.branchGap = { deg: isFinite(minGap) ? Math.round(minGap * 100) / 100 : 180, level: minGapLv, at: minGapAt, l1MinDeg: isFinite(l1Min) ? Math.round(l1Min * 100) / 100 : 180 };
    st.maxR = Math.round(maxR * 10) / 10;
    st.relaxMax = FREE_COLLIDE * LAYOUT_MIN_D;
    st.seedMax = (function () { var m2 = 0; NS.forEach(function (o) { var d2 = Math.sqrt(o.sx * o.sx + o.sy * o.sy); if (d2 > m2) m2 = d2; }); return Math.round(m2 * 10) / 10; })();
    st.aspect = 1;
    st.rot = 0;
    st.settleRounds = settleRounds;
    st.hardOvershoot = Math.round(hardOvershoot * 100) / 100;
    st.phaseMs = { seed: 0, relax: Math.round(perfNow() - t0), total: Math.round(perfNow() - t0) };
    st.settledMin = isFinite(minPair) ? Math.round(minPair * 100) / 100 : 0;
    st.minPair = isFinite(minPair) ? minPair : 0;
    st.minPairIds = [minA, minB];
    return st;
  }

  /* 布局分流：默认放射树（V14）；?layout=polar 回退旧极坐标（旧实现原样保留，一行不改） */
  function computeLayout() {
    if (LAYOUT_MODE === 'polar') {
      layoutRuns++;
      var t0 = perfNow();
      computeLayoutPolar();
      return layoutMetrics('polar', t0, 0, 0);
    }
    return computeLayoutRadial();
  }

  function layoutHash() {
    var h = 2166136261;
    NODES.forEach(function (n) {
      var p = POS.get(n.id) || { x: 0, y: 0 };
      var s = n.id + ':' + p.x.toFixed(4) + ',' + p.y.toFixed(4) + ';';
      for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = (h * 16777619) >>> 0; }
    });
    return ('0000000' + h.toString(16)).slice(-8);
  }
  function layoutCoords() {
    return NODES.map(function (n) {
      var p = BASE.get(n.id);
      return p ? n.id + '|' + p.x.toFixed(4) + '|' + p.y.toFixed(4) : n.id + '|<none>';
    });
  }
  function relayout() {
    computeLayout();
    snapshotBase();
    resetPositions();
    syncPositions();
    applyViewport();
  }

  /* =========================================================
     4. DOM 节点
     ========================================================= */
  var nodesLayer = document.getElementById('nodes');
  var world = document.getElementById('world');

  function buildElements() {
    NODES.forEach(function (n) {
      var el = document.createElement('div');
      el.className = 'node';
      el.setAttribute('data-id', n.id);
      el.setAttribute('data-state', 'hidden');
      var p = POS.get(n.id) || { x: 0, y: 0 };
      el.style.left = p.x.toFixed(2) + 'px';
      el.style.top = p.y.toFixed(2) + 'px';
      var halo = document.createElement('div'); halo.className = 'halo';
      var hit = document.createElement('div'); hit.className = 'hit';
      var dot = document.createElement('div'); dot.className = 'dot';
      var hint = document.createElement('div'); hint.className = 'hint';
      el.appendChild(halo); el.appendChild(hit); el.appendChild(dot); el.appendChild(hint);
      el.addEventListener('click', function (ev) {
        ev.stopPropagation();
        if (perfNow() - lastNodeDrag < 280) return;   /* 刚拖完，不把拖拽尾click当成点击 */
        onNodeClick(n.id);
      });
      el.addEventListener('dblclick', function (ev) {
        ev.stopPropagation();
        resetNodePos(n.id);
      });
      el.addEventListener('pointerenter', function () { if (!ND) { ACTIVE_ID = n.id; refreshFocus(); } });
      el.addEventListener('pointerleave', function () { if (!ND && ACTIVE_ID === n.id) { ACTIVE_ID = null; refreshFocus(); } });
      el.addEventListener('pointerdown', function (ev) { startNodeDrag(ev, n); });
      nodesLayer.appendChild(el);
      n.el = el; n.elHint = hint; n.elDot = dot; n.elHalo = halo; n.elHit = hit;
    });
  }

  /* ---------- 节点拖拽（连线由画布每帧按 POS 重绘，天然跟随） ---------- */
  function queueHints() {
    if (hintTimer) return;
    hintTimer = setTimeout(function () { hintTimer = null; layoutHints(); }, 70);
  }

  function startNodeDrag(ev, n) {
    if (ev.button !== 0 || ev.isPrimary === false) return;
    var st = n.el.getAttribute('data-state');
    if (st !== 'lit' && st !== 'mapped' && st !== 'echo') return;
    var p = POS.get(n.id); if (!p) return;
    ev.stopPropagation();
    ND = { id: n.id, el: n.el, sx: ev.clientX, sy: ev.clientY, px: p.x, py: p.y, k: S.viewport.k, moved: false, pid: ev.pointerId };
    ACTIVE_ID = n.id;
    refreshFocus();                        /* 拖拽期间 focusId() 返回 null → 聚焦与压暗全部复原 */
    n.el.classList.add('dragging');
    document.body.classList.add('node-dragging');
    var b = BASE.get(n.id);
    if (b) {
      var a = document.createElement('div'); a.className = 'anchor';
      var sz = 34 / S.viewport.k;
      a.style.width = sz.toFixed(1) + 'px';
      a.style.height = sz.toFixed(1) + 'px';
      a.style.margin = (-sz / 2).toFixed(1) + 'px 0 0 ' + (-sz / 2).toFixed(1) + 'px';
      a.style.left = b.x.toFixed(2) + 'px';
      a.style.top = b.y.toFixed(2) + 'px';
      nodesLayer.appendChild(a);
      ND.anchor = a;
    }
    try { n.el.setPointerCapture(ev.pointerId); } catch (e2) { }
  }

  function moveNodeDrag(e) {
    if (!ND) return;
    var dx = (e.clientX - ND.sx) / ND.k;
    var dy = (e.clientY - ND.sy) / ND.k;
    if (!ND.moved && Math.abs(e.clientX - ND.sx) + Math.abs(e.clientY - ND.sy) > 3) ND.moved = true;
    var np = { x: ND.px + dx, y: ND.py + dy };
    POS.set(ND.id, np);
    ND.el.style.left = np.x.toFixed(2) + 'px';
    ND.el.style.top = np.y.toFixed(2) + 'px';
    queueHints();
  }

  function endNodeDrag(ev) {
    if (!ND) return;
    var cur = ND, n = byId.get(cur.id);
    if (cur.moved) {
      var b = BASE.get(cur.id), p = POS.get(cur.id);
      if (b && p) OFFSET.set(cur.id, { x: p.x - b.x, y: p.y - b.y });
      lastNodeDrag = perfNow();
    }
    cur.el.classList.remove('dragging');
    document.body.classList.remove('node-dragging');
    if (cur.anchor && cur.anchor.parentNode) cur.anchor.parentNode.removeChild(cur.anchor);
    if (ev && cur.el.releasePointerCapture) { try { cur.el.releasePointerCapture(cur.pid); } catch (e) { } }
    ND = null;
    if (ACTIVE_ID === cur.id) ACTIVE_ID = null;
    refreshFocus();
    layoutHints();
    scheduleSave();
    if (cur.moved && n && !S.dragHinted) {
      S.dragHinted = true;
      /* 泄题防护：未点亮 / 灰影节点绝不念名字，只确认「挪了一个未点亮的节点」 */
      toast(S.litSet.has(n.id)
        ? '已挪动「' + n.label + '」，双击节点可归位'
        : '已挪动一个未点亮的节点，双击可归位', 'ok');
    }
  }

  function resetNodePos(id) {
    OFFSET.delete(id);
    var b = BASE.get(id);
    if (b) POS.set(id, { x: b.x, y: b.y });
    syncPositions();
    layoutHints();
    scheduleSave();
    var n = byId.get(id);
    if (n && n.el && n.el.getAttribute('data-state') !== 'hidden') {
      /* 同一规则：归位提示也不许暴露未点亮节点的名字 */
      toast(S.litSet.has(n.id) ? '已归位：' + n.label : '已归位一个未点亮的节点', 'ok');
    }
  }

  function resetAllPositions() {
    OFFSET.clear();
    resetPositions();
    syncPositions();
    /* V16「归位」= 根回画布正中 + k 复位 1.0（不是「把所有节点塞回画布」） */
    S.userMoved = false;
    cameraHome();
    layoutHints();
    scheduleSave();
    toast('星图已归位（根回正中，缩放复位）', 'ok');
  }

  /* V4 / D2：三档提示文案 */
  function hintText(n) {
    if (S.difficulty === 'hard') return '';
    var head = '第' + n.level + '层·' + n.chars + '字';
    if (S.difficulty === 'standard') return head;
    var lbl = String(n.label || '');
    if (!lbl) return head;
    var chars = Math.max(2, n.chars | 0);
    var mid = '';
    var i;
    for (i = 0; i < Math.min(chars - 2, 3); i++) mid += '□';
    var last = (chars >= 4 && lbl.length >= chars) ? lbl.charAt(chars - 1) : '';
    return head + '  ' + lbl.charAt(0) + mid + last;
  }

  function refreshNode(n) {
    var el = n.el; if (!el) return;
    var state = 'hidden';
    var isLit = S.litSet.has(n.id);
    if (isLit) state = 'lit';
    else if (S.review) state = 'review';      /* 复盘揭晓：所有未点亮节点显形并显示全名 */
    else if (S.echo.has(n.id)) state = 'echo';
    else if (S.mapped.has(n.id)) state = 'mapped';
    if (el.getAttribute('data-state') !== state) {
      el.setAttribute('data-state', state);
      var boostCls = (state === 'mapped' && S.boost.has(n.id)) ? ' boost' : '';
      var echoCls = (state === 'review' && S.echo.has(n.id)) ? ' rv-echo' : '';
      el.className = 'node' + (state === 'hidden' ? '' : ' ' + state) + boostCls + echoCls + (n.id === ROOT_ID ? ' root' : '');
    } else if (state === 'review') {
      /* state 没变时也要保证 echo 标记跟随（复盘期间拖拽 / 交互不改变 echo 集合，这里只为稳妥） */
      el.classList.toggle('rv-echo', S.echo.has(n.id));
    }
    var named = (state === 'lit' || state === 'review');
    /* A2：名字按缩放分级显示；被分级压掉时给空串（不退回「第N层·X字」，那是未点亮节点的机制提示） */
    var shown = named && labelAllowed(n);
    var txt = named ? (shown ? n.label : '') : (hintAllowed(n) ? hintText(n) : '');
    if (n.elHint.textContent !== txt) n.elHint.textContent = txt;
    /* 阶梯只作用于可见节点：一旦隐形必须清掉 f1..f4 与内联变量，否则 .node.f4 的 opacity 会盖过 .node{opacity:0} */
    if (state === 'hidden') ladderClear(n);
    /* 长 label 会被 CSS 省略号截断，鼠标悬停仍能看全名 */
    var tip = shown ? n.label : '';
    if (n.elHint.title !== tip) n.elHint.title = tip;
  }

  function refreshAll() {
    if (!S.booted) world.classList.add('noanim');
    NODES.forEach(refreshNode);
    updateHUD();
    if (FOCUS_ID) ladderApply();   /* 可见集变化后把阶梯重贴一遍（不递归） */
    /* V16：普通态点亮不再自动 fit（k 只由用户滚轮/拖拽决定）；复盘才做整图拟合 */
    if (S.review && !S.userMoved) { if (S.booted) world.classList.add('smooth'); fitReview(); }
  }

  /* =========================================================
     5. 匹配 / 歧义
     ========================================================= */
  function nodeKeys(n) {
    if (n.__keys) return n.__keys;
    var set = new Set();
    (n.keywords || []).forEach(function (k) { var t = normalize(k); if (t) set.add(t); });
    var l = normalize(n.label); if (l) set.add(l);
    n.__keys = Array.from(set);
    return n.__keys;
  }

  /* D5 宽松匹配 */
  function nodeMatches(n, norm) {
    if (!norm) return false;
    var keys = nodeKeys(n);
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i];
      if (norm === k) return true;
      if (k.length >= 2 && norm.indexOf(k) >= 0) return true;
      if (norm.length >= 2 && k.indexOf(norm) >= 0) return true;
    }
    return false;
  }

  function candidateNodes() {
    var out = [];
    NODES.forEach(function (n) {
      if (!S.litSet.has(n.id) && S.mapped.has(n.id)) out.push(n);
    });
    if (S.jumpMode) {
      NODES.forEach(function (n) {
        if (S.litSet.has(n.id) || S.mapped.has(n.id)) return;
        if (isDeepDescendantOfLit(n.id)) out.push(n);
      });
    }
    return out;
  }

  function isDeepDescendantOfLit(id) {
    var cur = parentMap.get(id); var hops = 1; var guard = 0;
    while (cur && guard++ < 32) {
      if (S.litSet.has(cur) && hops >= 2) return true;
      cur = parentMap.get(cur); hops++;
    }
    return false;
  }

  function hopsFromLit() {
    var dist = new Map();
    var q = [];
    S.litSet.forEach(function (id) { dist.set(id, 0); q.push(id); });
    var i = 0;
    while (i < q.length) {
      var cur = q[i++]; var d = dist.get(cur);
      var adj = adjMap.get(cur) || [];
      for (var j = 0; j < adj.length; j++) {
        if (!dist.has(adj[j])) { dist.set(adj[j], d + 1); q.push(adj[j]); }
      }
    }
    return dist;
  }

  /* C1 可猜范围：0=已亮节点的直接子代  1=frontier  2=跳层候选  3=已点亮 */
  function scopeRank(n) {
    if (S.litSet.has(n.id)) return 3;
    var p = parentMap.get(n.id);
    if (p && S.litSet.has(p)) return 0;
    if (S.mapped.has(n.id)) return 1;
    return 2;
  }

  /* C1/V6 决胜：可猜范围 → level 浅者 → 距已亮更近 → id 字典序（绝不随机、绝不按数组顺序） */
  function resolveMatch(matches) {
    if (!matches || !matches.length) return { node: null, ambiguous: false, matched: 0 };
    var dist = hopsFromLit();
    var bestNode = null, bestKey = null;
    matches.forEach(function (n) {
      var key = [
        scopeRank(n),
        n.level,
        dist.has(n.id) ? dist.get(n.id) : 1e9,
        n.id
      ];
      if (!bestKey) { bestKey = key; bestNode = n; return; }
      for (var i = 0; i < key.length; i++) {
        if (key[i] < bestKey[i]) { bestKey = key; bestNode = n; return; }
        if (key[i] > bestKey[i]) return;
      }
    });
    return { node: bestNode, ambiguous: matches.length > 1, matched: matches.length };
  }

  function distinctNodes(list) {
    var set = new Set(), out = [];
    list.forEach(function (x) {
      var id = x.id || (x.n && x.n.id);
      if (!id || set.has(id)) return;
      set.add(id); out.push(x.id ? x : x.n);
    });
    return out;
  }

  /* C1 四条命中路径：① 精确相等 → ② 最长 keyword → ③ 已点亮提示 → ④ 无命中 */
  function resolveGuess(text) {
    var q = normalize(text);
    if (!q) return { kind: 'empty', rule: '空输入' };
    var pool = candidateNodes();   /* 未点亮且当前可猜 */
    var i, n, ks;

    /* ① 精确相等 */
    var exact = [];
    pool.forEach(function (x) {
      var kk = nodeKeys(x);
      for (var j = 0; j < kk.length; j++) if (kk[j] === q) { exact.push(x); return; }
    });
    if (exact.length) {
      var r1 = resolveMatch(exact);
      return { kind: 'exact', rule: '1-精确相等', node: r1.node, ambiguous: exact.length > 1, matched: exact.length };
    }

    /* ② D5 宽松匹配里取 keyword 最长者；并列时「输入包含 keyword」优先 */
    var loose = [];
    pool.forEach(function (x) {
      var kk = nodeKeys(x);
      for (var j = 0; j < kk.length; j++) {
        var k = kk[j], dir = -1;
        if (k.length >= 2 && q.indexOf(k) >= 0) dir = 0;
        else if (q.length >= 2 && k.indexOf(q) >= 0) dir = 1;
        if (dir < 0) continue;
        loose.push({ n: x, len: k.length, dir: dir, k: k });
      }
    });
    if (loose.length) {
      var maxLen = 0;
      loose.forEach(function (x) { if (x.len > maxLen) maxLen = x.len; });
      var top = loose.filter(function (x) { return x.len === maxLen; });
      var hasDir0 = false;
      top.forEach(function (x) { if (x.dir === 0) hasDir0 = true; });
      var use = hasDir0 ? top.filter(function (x) { return x.dir === 0; }) : top;
      var uniq = distinctNodes(use);
      var r2 = resolveMatch(uniq);
      return {
        kind: 'loose', rule: '2-最长keyword(' + maxLen + '字)', node: r2.node,
        ambiguous: distinctNodes(loose).length > 1, matched: distinctNodes(loose).length, kw: use[0].k
      };
    }

    /* ③ 命中节点已点亮：不计错误、不重复计数 */
    var litHits = [];
    var litLoose = [];
    NODES.forEach(function (x) {
      if (!S.litSet.has(x.id)) return;
      var kk = nodeKeys(x);
      for (var j = 0; j < kk.length; j++) if (kk[j] === q) { litHits.push(x); return; }
    });
    if (!litHits.length) {
      NODES.forEach(function (x) {
        if (!S.litSet.has(x.id)) return;
        var kk = nodeKeys(x);
        for (var j = 0; j < kk.length; j++) {
          var k = kk[j];
          if ((k.length >= 2 && q.indexOf(k) >= 0) || (q.length >= 2 && k.indexOf(q) >= 0)) { litHits.push(x); return; }
        }
      });
    }
    if (litHits.length) {
      var r3 = resolveMatch(litHits);
      return { kind: 'already', rule: '3-已点亮', node: r3.node, ambiguous: litHits.length > 1, matched: litHits.length };
    }

    /* ④ 全无命中 */
    return { kind: 'miss', rule: '4-无命中' };
  }

  /* =========================================================
     6. 点亮 / 存档
     ========================================================= */
  function mapNeighbors(id) {
    (childMap.get(id) || []).forEach(function (c) { S.mapped.add(c); });
    relMap.get(id).forEach(function (r) { S.mapped.add(r); });
  }

  function ripple(n) {
    var p = POS.get(n.id); if (!p) return;
    var el = document.createElement('div');
    el.className = 'rippler';
    el.style.left = p.x + 'px';
    el.style.top = p.y + 'px';
    nodesLayer.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 1050);
  }

  function flashHalo(n) {
    if (!n.elHalo) return;
    n.elHalo.style.animation = 'flashpulse .95s ease-out';
    setTimeout(function () { if (n.elHalo) n.elHalo.style.animation = (n.id === ROOT_ID ? '' : ''); }, 1000);
  }

  function launchFlights(n) {
    var t0 = perfNow();
    var adj = adjMap.get(n.id) || [];
    var froms = adj.filter(function (a) { return S.litSet.has(a); }).slice(0, 5);
    if (!froms.length) return;
    froms.forEach(function (f) { FLIGHTS.push({ a: f, b: n.id, t0: t0, dur: 540 }); });
    froms.forEach(function (f) { FLASH.set(f + '>' + n.id, t0); FLASH.set(n.id + '>' + f, t0); });
  }

  function lightNode(id, opts) {
    opts = opts || {};
    var n = byId.get(id);
    if (!n) return false;
    if (S.litSet.has(id)) { mapNeighbors(id); refreshAll(); return false; }
    var mappedBefore = new Set(S.mapped);
    S.litSet.add(id);
    S.mapped.add(id);
    S.echo.delete(id);
    S.lit.push({ id: id, order: S.lit.length + 1, jump: !!opts.jump, ts: now() });
    if (opts.jump) {
      var cur = parentMap.get(id);
      var guard = 0;
      while (cur && byId.has(cur) && guard++ < 64) {
        if (S.litSet.has(cur)) break;
        if (cur !== ROOT_ID) S.echo.add(cur);
        S.mapped.add(cur);
        cur = parentMap.get(cur);
      }
    }
    mapNeighbors(id);
    S.lastLit = id;
    if (!opts.silent) { ripple(n); flashHalo(n); }
    launchFlights(n);
    refreshAll();
    /* 补看：新点亮节点 + 刚映射出来的邻居若在可用区外，只平移（不动 k） */
    var fresh = [id];
    S.mapped.forEach(function (x) { if (!mappedBefore.has(x)) fresh.push(x); });
    if (!opts.silent) revealNodes(fresh);
    scheduleSave();
    return true;
  }

  /* 存档版本：数据改版后 node id 全换成文件名，旧存档里的 id 已不存在 → 换前缀 + 读到旧前缀直接丢弃重建 */
  var SAVE_PREFIX = 'starmap:v3:';
  function saveKey(d) { return SAVE_PREFIX + (d || S.difficulty); }
  function migrateSaves() {
    var kill = [];
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf('starmap:') === 0 && k.indexOf(SAVE_PREFIX) !== 0) kill.push(k);
      }
      kill.forEach(function (k) { localStorage.removeItem(k); });
    } catch (e) { /* 隐私模式下 localStorage 不可写，忽略 */ }
    S.droppedSaves = (S.droppedSaves || 0) + kill.length;
    return kill.length;
  }

  function saveNow() {
    if (NO_SAVE) return;       /* ?quiet=1：取证跑不产生任何 localStorage 写入 */
    if (S.review) return;      /* 复盘态不落盘（硬要求：揭晓不污染真实进度） */
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
    try {
      var payload = {
        litIds: S.lit.map(function (x) { return { id: x.id, order: x.order, jump: x.jump, ts: x.ts }; }),
        wrongCount: S.wrong,
        difficulty: S.difficulty,
        offsets: (function () {
          var o = {};
          OFFSET.forEach(function (v, id) { o[id] = [Math.round(v.x * 10) / 10, Math.round(v.y * 10) / 10]; });
          return o;
        })(),
        viewport: { x: Math.round(S.viewport.x * 100) / 100, y: Math.round(S.viewport.y * 100) / 100, k: Math.round(S.viewport.k * 1000) / 1000 },
        startedAt: S.startedAt
      };
      localStorage.setItem(saveKey(), JSON.stringify(payload));
    } catch (e) { /* 隐私模式下 localStorage 可能不可写，忽略 */ }
  }
  function scheduleSave() {
    if (NO_SAVE) return;
    if (S.review) return;      /* 复盘态不落盘：进入/退出都不触发存档 */
    if (saveTimer) return;
    saveTimer = setTimeout(function () { saveTimer = null; saveNow(); }, 220);
  }

  function resetMemory(diff) {
    S.difficulty = diff;
    S.lit = [];
    S.litSet = new Set();
    S.mapped = new Set();
    S.echo = new Set();
    S.boost = new Set();
    S.wrong = 0;
    S.submits = 0;
    S.lastLit = null;
    S.startedAt = now();
    S.userMoved = false;
    S.dragHinted = false;
    S.viewport = { x: 0, y: 0, k: 1 };
    S.prunedIds = [];
    OFFSET.clear();
    ND = null;
    ACTIVE_ID = null;
  }

  function loadSave() {
    var raw = null;
    try { raw = localStorage.getItem(saveKey()); } catch (e) { raw = null; }
    if (!raw) return false;
    var data;
    try { data = JSON.parse(raw); } catch (e) { return false; }
    if (!data || !Array.isArray(data.litIds)) return false;
    S.lit = [];
    var pruned = [];
    data.litIds.forEach(function (x) {
      if (!x || !x.id) return;
      /* 数据重建后旧 id 会消失：静默剔除，否则「已点亮 N 却只有 N-1 颗星」 */
      if (!byId.has(x.id)) { pruned.push(x.id); return; }
      if (S.litSet.has(x.id)) return;
      S.litSet.add(x.id);
      S.lit.push({ id: x.id, order: S.lit.length + 1, jump: !!x.jump, ts: x.ts || now() });
    });
    S.prunedIds = pruned;
    if (!S.litSet.has(ROOT_ID)) {
      S.litSet.add(ROOT_ID);
      S.lit.unshift({ id: ROOT_ID, order: 0, jump: false, ts: data.startedAt || now() });
      S.lit.forEach(function (x, i) { x.order = i + 1; });
    }
    S.wrong = Math.max(0, data.wrongCount | 0);
    S.submits = S.lit.length + S.wrong;
    S.startedAt = data.startedAt || (S.lit[0] ? S.lit[0].ts : now());
    /* 重建可见集合 */
    S.mapped = new Set();
    S.echo = new Set();
    S.boost = new Set();
    S.lit.forEach(function (x) { S.mapped.add(x.id); });
    S.lit.forEach(function (x) {
      mapNeighbors(x.id);
      if (x.jump) {
        var cur = parentMap.get(x.id); var guard = 0;
        while (cur && byId.has(cur) && guard++ < 64) {
          /* 已点亮的中途祖先不产生灰影，但必须继续往上走：
             否则「灰影后来被补答」会把它更远的未点亮祖先从存档里丢掉 */
          if (!S.litSet.has(cur) && cur !== ROOT_ID) S.echo.add(cur);
          S.mapped.add(cur);
          cur = parentMap.get(cur);
        }
      }
    });
    S.lastLit = S.lit.length ? S.lit[S.lit.length - 1].id : null;
    /* 拖拽布局：与点亮进度一起存档，刷新/切难度回来仍是自己摆过的样子 */
    if (data.offsets && typeof data.offsets === 'object') {
      Object.keys(data.offsets).forEach(function (id) {
        var v = data.offsets[id];
        if (!byId.has(id) || !Array.isArray(v) || !isFinite(v[0]) || !isFinite(v[1])) return;
        OFFSET.set(id, { x: clamp(+v[0], -8000, 8000), y: clamp(+v[1], -8000, 8000) });
      });
    }
    resetPositions();
    syncPositions();
    if (data.viewport && typeof data.viewport.k === 'number') {
      S.viewport = { x: +data.viewport.x || 0, y: +data.viewport.y || 0, k: clamp(+data.viewport.k || 1, 0.15, 4) };
      S.userMoved = true;
    }
    return true;
  }

  function clearSaves() {
    try {
      var kill = [];
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf('starmap:') === 0) kill.push(k);
      }
      kill.forEach(function (k) { localStorage.removeItem(k); });
    } catch (e) { /* ignore */ }
  }

  /* =========================================================
     7. 交互：提交 / 点击 / 难度
     ========================================================= */
  var guessEl = document.getElementById('guess');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  var LAST_TOAST = '';
  var TOAST_KEEP = false;

  function toast(msg, kind) {
    LAST_TOAST = msg;
    toastEl.textContent = msg;
    toastEl.className = 'show' + (kind ? ' ' + kind : '');
    if (toastTimer) clearTimeout(toastTimer);
    if (TOAST_KEEP) return;          /* 证据截图用：?toastkeep=1 让 toast 常驻，便于拍下来 */
    toastTimer = setTimeout(function () { toastEl.className = ''; }, 1900);
  }

  function feedbackError() {
    guessEl.classList.remove('shake');
    void guessEl.offsetWidth;
    guessEl.classList.add('shake', 'err');
    setTimeout(function () { guessEl.classList.remove('shake', 'err'); }, 420);
  }

  function submitGuess(text) {
    if (S.review) return { ok: false, reason: 'review', rule: '0-复盘模式' };  /* 复盘态不产生进度 */
    var norm = normalize(text);
    if (!norm) return { ok: false, empty: true };
    var r = resolveGuess(norm);

    /* ③ 已点亮：不计错误，并把它的未点亮子代提亮一档 */
    if (r.kind === 'already') {
      var kids = (childMap.get(r.node.id) || []).filter(function (c) { return !S.litSet.has(c); });
      kids.forEach(function (c) { S.mapped.add(c); S.boost.add(c); });
      if (r.node.el) ripple(r.node);
      refreshAll();
      scheduleSave();
      toast('这颗星已经亮着' + (kids.length ? '，它的子代已提亮' : ''), 'ok');
      return { ok: false, reason: 'already', id: r.node.id, boosted: kids.length, rule: r.rule };
    }

    /* ④ 全无命中 */
    if (r.kind === 'miss' || !r.node) {
      S.submits++;
      S.wrong++;
      feedbackError();
      toast('没有匹配，再想想', 'err');
      scheduleSave();
      updateHUD();
      return { ok: false, reason: 'nomatch', rule: r.rule };
    }

    S.submits++;
    var node = r.node;
    var wasFrontier = isFrontier(node.id);
    var jump = !wasFrontier;
    S.boost.delete(node.id);
    lightNode(node.id, { jump: jump });
    if (r.ambiguous) toast('匹配到多个，取其一', 'ok');
    else toast('点亮：' + node.label, 'ok');
    return { ok: true, id: node.id, jump: jump, ambiguous: r.ambiguous, matched: r.matched, rule: r.rule };
  }

  /* ---------- 属性卡：理论 / 心理学家 / 实验 ----------
     只对「已点亮」节点开放；未点亮 / 灰影 / 未映射一律点不出，避免泄题。 */
  var ATTR_KEYS = [
    { key: 'theory', label: '理论' },
    { key: 'psychologist', label: '心理学家' },
    { key: 'experiment', label: '实验' }
  ];
  var ATTRS_ID = null;

  function attrList(n, key) {
    var a = n && n.attrs, v = a && a[key];
    if (!Array.isArray(v)) return [];
    return v.filter(function (x) { return typeof x === 'string' && x.replace(/\s+/g, ''); });
  }

  function attrTotal(n) {
    return attrList(n, 'theory').length + attrList(n, 'psychologist').length + attrList(n, 'experiment').length;
  }

  /* 已点亮 → 可查；复盘揭晓态 → 全图已公开，也可查（复盘查属性是刚需） */
  function attrsCanOpen(id) { return !!(id && byId.has(id) && (S.litSet.has(id) || S.review)); }

  /* ---------- 面板「关系」区：直接子节点 / 关联 ----------
     名字可见性只有一条真源：S.litSet（复盘态 S.review 全公开）。
     未点亮的名字一律换成遮罩块（无文字），与正文 [[X]] 用的是同一套判定。 */
  function relReadable(id) { return !!(id && (S.litSet.has(id) || S.review)); }
  function maskSpan() {
    var m = document.createElement('span');
    m.className = 'wl wl-locked wl-mask';
    m.title = '未点亮：点亮后才能看';
    m.addEventListener('click', function (ev) { ev.stopPropagation(); toast('还没点亮，回忆它才能跳', 'err'); });
    return m;
  }
  function relDot(id) {
    var d = document.createElement('span');
    d.className = 'ard ' + (S.litSet.has(id) ? 'lit' : (S.echo.has(id) ? 'echo' : (S.mapped.has(id) ? 'mapped' : 'hidden')));
    return d;
  }
  function relNameSpan(id) {
    var t = byId.get(id);
    if (!t) { var pl = document.createElement('span'); pl.className = 'wl-plain'; pl.textContent = String(id); return pl; }
    if (!relReadable(id)) return maskSpan();
    var a = document.createElement('span');
    a.className = 'arrlink';
    a.textContent = t.label;
    a.title = '打开「' + t.label + '」的笔记';
    a.addEventListener('click', function (ev) { ev.stopPropagation(); openAttrs(t.id); refreshFocus(); });
    return a;
  }
  function renderPanelRelations(n) {
    var host = document.getElementById('attrs-rel');
    var out = { rows: 0, masks: 0, names: 0, groups: [] };
    if (!host) return out;
    host.textContent = '';
    if (!n) { host.setAttribute('data-rows', '0'); return out; }
    var groups = [
      { key: 'children', label: '直接子节点', ids: (childMap.get(n.id) || []).slice() },
      { key: 'related', label: '关联', ids: Array.from(relMap.get(n.id) || []) }
    ];
    groups.forEach(function (g) {
      var ids = g.ids.filter(function (id) { return byId.has(id); });
      if (!ids.length) return;                       /* 没有内容就整块不渲染 */
      var head = document.createElement('div');
      head.className = 'arl';
      head.textContent = g.label + ' ' + ids.length;
      host.appendChild(head);
      ids.forEach(function (cid) {
        var row = document.createElement('div');
        row.className = 'arr';
        row.setAttribute('data-rel-id', cid);
        row.appendChild(relDot(cid));
        row.appendChild(relNameSpan(cid));
        host.appendChild(row);
        out.rows++;
        if (relReadable(cid)) out.names++; else out.masks++;
      });
      out.groups.push(g.label + ' ' + ids.length);
    });
    host.setAttribute('data-rows', String(out.rows));
    return out;
  }
  function relationsState() {
    var host = document.getElementById('attrs-rel');
    if (!host) return { rows: 0, masks: 0, names: 0, groups: [], namesText: [], text: '' };
    var rows = host.querySelectorAll('.arr');
    var named = host.querySelectorAll('.arr .arrlink');
    return {
      rows: rows.length,
      masks: host.querySelectorAll('.arr .wl-mask').length,
      names: named.length,
      groups: Array.prototype.slice.call(host.querySelectorAll('.arl')).map(function (h) { return h.textContent; }),
      namesText: Array.prototype.slice.call(named).map(function (a) { return a.textContent; }),
      text: host.textContent
    };
  }

  function openAttrs(id) {
    if (!attrsCanOpen(id)) { closeAttrs(); return false; }
    var n = byId.get(id);
    ATTRS_ID = id;
    var box = document.getElementById('attrs');
    document.getElementById('attrs-title').textContent = n.label;
    document.getElementById('attrs-title').title = n.label;

    box.classList.toggle('blank', total === 0);
    /* 属性 → 分隔线 → 关系区 → 正文 */

  /* 合成一次真实拖拽（startNodeDrag/moveNodeDrag/endNodeDrag 全走真代码），返回 toast 文本供断言 */
  function dragProbe(kind) {
    var pool = NODES.filter(function (n) {
      if (!n.el) return false;
      return kind === 'lit' ? S.litSet.has(n.id) : (S.mapped.has(n.id) && !S.litSet.has(n.id));
    });
    var n = pool[0];
    if (!n) return null;
    var r = n.el.getBoundingClientRect();
    var x = Math.round(r.left + r.width / 2) || 320, y = Math.round(r.top + r.height / 2) || 320;

      catch (e) { ev = new MouseEvent(type, { bubbles: true, cancelable: true, clientX: cx, clientY: cy, button: 0 }); }

    pe('pointerdown', n.el, x, y, 1);

    pe('pointerup', document, x + 26, y + 9, 0);

    return { id: n.id, label: n.label, toast: LAST_TOAST, keywords: n.keywords || [] };
  }

  function onNodeClick(id) {

      var rv = byId.get(id);
      if (rv) { ripple(rv); toggleAttrs(id); }
      return;
    }
    if (!S.litSet.has(id)) { closeAttrs(); return; }   /* 未点亮 / 灰影：连卡都不弹 */
    mapNeighbors(id);
    var n = byId.get(id); if (n) { ripple(n); }
    refreshAll();
    scheduleSave();
    toggleAttrs(id);
  }

  function switchDifficulty(d) {

    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }

  /* =========================================================
     9. 视口 + 画布
     ========================================================= */
  /* =========================================================

  var FOCUS_ID = null;                    /* 当前聚焦中心（悬停优先，其次面板所属节点） */
  var LABEL_TIER = 'all';                 /* 标签显示分级：all / hub / focus，随 k 变化 */
  var T_HUB = 0.55, T_FOCUS = 0.35;       /* A2 阈值：k>=0.55 全显；0.35<=k<0.55 只显枢纽；k<0.35 只显聚焦 */

  function labelTier() {

  }
  function degreeOf(id) { var a = adjMap.get(id); return a ? a.length : 0; }
  function labelAllowed(n) {
    /* 复盘揭晓是答案卷：缩放分级（all/hub/focus）一律让位，名字一个都不许被吞；
       装不下交给 layoutHints 的逐节点碰撞裁剪（复盘态容差放宽到 26%）。
       旧行为在 k=0.40 时把 64/99 个名字变空串，画面只剩 34 个名字 —— 那不是「揭晓全图」。 */
    if (S.review) return true;
    if (LABEL_TIER === 'all') return true;

  var HINT_TIER = 'all';                  /* all / focus */
  var T_HINT = 0.45;
  function hintTier() { return S.viewport.k >= T_HINT ? 'all' : 'focus'; }
  /* 低倍时只留聚焦节点（含悬停节点、面板所属节点）的提示；其余未点亮节点只剩点/环 */
  function hintAllowed(n) { return HINT_TIER === 'all' || n.id === FOCUS_ID; }
  /* 聚焦中心：悬停优先，其次是「面板所属节点」（点开面板后聚焦保持住）；拖拽期间不加聚焦 */

    if (ATTRS_ID && byId.has(ATTRS_ID)) return ATTRS_ID;
    return null;
  }
  /* ---------- V23 悬停跳数阶梯：BFS 四档 + 不透明度/光晕/连线三层表现 + 方向双重调制 ----------
     距离口径唯一：无向图 = edges.tree + edges.related，BFS 从 FOCUS_ID 出发，hop>=4 归第 4 档。
     焦点变化时算一次（105 节点），一次写内联变量；不逐帧、不新起 state。 */
  var LADDER = {

    soft: { op: [1.00, 0.95, 0.62, 0.36, 0.14], halo: [1.30, 1.05, 0.65, 0, 0], edge: [1.00, 0.62, 0.32, 0.12], ew: [1.00, 0.88, 0.75, 0.62] },
    std:  { op: [1.00, 0.90, 0.52, 0.28, 0.10], halo: [1.25, 1.00, 0.60, 0, 0], edge: [1.00, 0.55, 0.26, 0.08], ew: [1.00, 0.85, 0.70, 0.55] },
    hard: { op: [1.00, 0.95, 0.45, 0.20, 0.06], halo: [1.20, 0.95, 0.55, 0, 0], edge: [1.00, 0.45, 0.18, 0.05], ew: [1.00, 0.80, 0.62, 0.45] }
  };
  var LADDER_TIER = 'std';
  /* 双重调制：只给 hop1 一点方向差（≤0.10），只当「从哪来」的轻提示 */
  var LADDER_MOD = { op: { parent: 0.06, child: 0, relatedOnly: -0.04 }, halo: { parent: 0.10, child: 0, relatedOnly: 0 } };
  function ladderCfg() { return LADDER[LADDER_TIER] || LADDER.std; }
  function setLadderTier(t) { if (LADDER[t] && t !== LADDER_TIER) { LADDER_TIER = t; if (FOCUS_ID) refreshFocus(); } return LADDER_TIER; }
  var HOP = new Map();                    /* 焦点变化时算一次：id -> 0..4 */
  function computeHops(fid) {
    HOP.clear();
    if (!fid) return;
    HOP.set(fid, 0);
    var q = [fid];
    for (var i = 0; i < q.length; i++) {
      var h = HOP.get(q[i]);
      if (h >= 4) continue;
      var adj = adjMap.get(q[i]) || [];
      for (var j = 0; j < adj.length; j++) {
        var nx = adj[j];
        if (HOP.has(nx)) continue;
        HOP.set(nx, h + 1);
        q.push(nx);
      }
    }
  }
  function hopOf(id) { if (!FOCUS_ID) return 0; var h = HOP.get(id); return h == null ? 4 : h; }
  function ladderDirOf(fid, id) {
    if (!fid || id === fid) return 'self';
    if (parentMap.get(fid) === id) return 'parent';
    if (parentMap.get(id) === fid) return 'child';
    return 'relatedOnly';
  }
  function ladderOpFor(fid, id) {
    var cfg = ladderCfg(), h = hopOf(id);
    var op = cfg.op[h], hk = cfg.halo[h], dir = fid ? ladderDirOf(fid, id) : null;
    if (fid && h === 1) {
      op = Math.min(1, op + (LADDER_MOD.op[dir] || 0));
      hk = Math.max(0, hk + (LADDER_MOD.halo[dir] || 0));
    }
    return { op: op, halo: hk, hop: h, dir: dir };
  }
  function ladderClear(n) {
    var el = n.el; if (!el || !el.classList) return;
    el.classList.remove('f1', 'f2', 'f3', 'f4');
    if (el.style.getPropertyValue('--hop-op')) el.style.removeProperty('--hop-op');
    if (el.style.getPropertyValue('--halo-k')) el.style.removeProperty('--halo-k');
  }
  function ladderApply() {
    var fid = FOCUS_ID;
    NODES.forEach(function (n) {
      var el = n.el; if (!el) return;
      if (!fid || el.getAttribute('data-state') === 'hidden') { ladderClear(n); return; }
      var v = ladderOpFor(fid, n.id);
      el.classList.remove('f1', 'f2', 'f3', 'f4');
      if (v.hop > 0) el.classList.add('f' + Math.min(4, v.hop));
      el.style.setProperty('--hop-op', v.op.toFixed(3));
      el.style.setProperty('--halo-k', v.halo.toFixed(3));
    });
  }
  function refreshFocus() {
    var fid = focusId();
    var changed = fid !== FOCUS_ID;
    FOCUS_ID = fid;
    if (changed) {
      computeHops(fid);
      NODES.forEach(refreshNode);        /* state 机会重建 className，故先刷 state 再上阶梯 */
      ladderApply();
      layoutHints();
    } else if (fid) {
      ladderApply();                     /* 可见集变化（点亮/复盘切换）后把阶梯重新贴一遍 */
    }
    return fid;
  }
  function medianOf(a) {
    if (!a || !a.length) return null;
    var b = a.slice().sort(function (x, y) { return x - y; }), m = b.length >> 1;
    return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2;
  }
  function ladderSc() {
    var v = parseFloat(getComputedStyle(world).getPropertyValue('--sc'));
    return isFinite(v) && v > 0 ? v : 1;
  }
  function haloBaseW(n) { return n.id === ROOT_ID ? 196 : 54; }
  /* 聚焦实测：全部读 computed style / 真实绘制用值，不自报常量（selftest、?focusprobe= 与 measure 共用） */
  function focusProbe() {
    var fid = FOCUS_ID;
    var byHop = { 1: [], 2: [], 3: [], 4: [] };      /* 图级 BFS：全部 105 节点，与可见性无关 */
    var visByHop = { 1: 0, 2: 0, 3: 0, 4: 0 };
    var opBy = { 0: [], 1: [], 2: [], 3: [], 4: [] };
    var haloBy = { 1: [], 2: [], 3: [], 4: [] };
    var dirOp = { parent: [], child: [], relatedOnly: [] };
    var sc = ladderSc(), selfOp = null, selfHalo = null;
    var hidden = 0, visible = 0, dimmed = 0, allOp = [], fCls = 0, hopVar = 0;
    if (fid) {
      HOP.forEach(function (h, id) { if (h >= 1 && h <= 4) byHop[h].push(id); });
    }
    NODES.forEach(function (n) {
      if (!n.el) return;
      if (n.el.style.getPropertyValue('--hop-op') || n.el.style.getPropertyValue('--halo-k')) hopVar++;
      if (n.el.classList.contains('f1') || n.el.classList.contains('f2') ||
        n.el.classList.contains('f3') || n.el.classList.contains('f4')) fCls++;
      if (n.el.getAttribute('data-state') === 'hidden') { hidden++; return; }
      visible++;
      var op = parseFloat(getComputedStyle(n.el).opacity);
      allOp.push(op);
      var hEl = n.el.querySelector('.halo');
      /* 光晕只有已点亮节点才有；用几何宽度 / (基准宽 × --sc) 反推真实倍率 */
      var hk = null;
      if (hEl && S.litSet.has(n.id)) {
        var w = parseFloat(getComputedStyle(hEl).width);
        hk = isFinite(w) ? w / (haloBaseW(n) * sc) : null;
      }
      if (!fid) return;
      var k = Math.min(4, hopOf(n.id));
      if (k === 0) { selfOp = op; selfHalo = hk; return; }
      visByHop[k]++;
      opBy[k].push(op);
      if (hk != null) haloBy[k].push(hk);
      if (op < 0.5) dimmed++;
      if (k === 1) { var d = ladderDirOf(fid, n.id); dirOp[d].push(op); }
    });
    /* 连线：按 (hop, 是否 related) 分组统计真实绘制用的 alpha 与阶梯倍率 */
    var groups = {}, order = [];
    function pushEdge(x, y, related) {
      var hop = edgeHop(x, y);
      if (hop < 0) return;
      var key = hop + '|' + (related ? 'r' : 't');
      if (!groups[key]) { groups[key] = { hop: hop, related: !!related, n: 0, alphas: [], muls: [] }; order.push(key); }
      var g = groups[key];
      g.n++;
      g.alphas.push(baseEdgeAlpha(x, y, related) * edgeMul(x, y, related));
      g.muls.push(edgeMul(x, y, related));
    }
    edgeTree.forEach(function (e) { pushEdge(e[0], e[1], false); });
    edgeRel.forEach(function (e) { pushEdge(e[0], e[1], true); });
    var edgeAlpha = order.sort().map(function (kk) {
      var g = groups[kk];
      return { hop: g.hop, related: g.related, n: g.n, alpha: medianOf(g.alphas), mul: medianOf(g.muls),
        alphaMax: Math.max.apply(null, g.alphas), mulMax: Math.max.apply(null, g.muls) };
    });
    return {
      id: fid, label: fid ? (byId.get(fid) || {}).label : null, tier: LADDER_TIER,
      byHop: byHop,
      counts: { hop1: byHop[1].length, hop2: byHop[2].length, hop3: byHop[3].length, hop4: byHop[4].length,
        visible: visible, hidden: hidden, dimmed: dimmed, visHop1: visByHop[1], visHop2: visByHop[2], visHop3: visByHop[3], visHop4: visByHop[4] },
      opacityMedian: { hop0: selfOp, hop1: medianOf(opBy[1]), hop2: medianOf(opBy[2]), hop3: medianOf(opBy[3]), hop4: medianOf(opBy[4]) },
      opacityN: { hop1: opBy[1].length, hop2: opBy[2].length, hop3: opBy[3].length, hop4: opBy[4].length },
      opacityRange: { hop1Min: opBy[1].length ? Math.min.apply(null, opBy[1]) : null, hop1Max: opBy[1].length ? Math.max.apply(null, opBy[1]) : null,
        hop4Max: opBy[4].length ? Math.max.apply(null, opBy[4]) : null },
      haloK: { hop0: selfHalo, hop1: medianOf(haloBy[1]), hop2: medianOf(haloBy[2]), hop3: medianOf(haloBy[3]), hop4: medianOf(haloBy[4]) },
      edgeAlpha: edgeAlpha,
      dir: { parent: medianOf(dirOp.parent), child: medianOf(dirOp.child), relatedOnly: medianOf(dirOp.relatedOnly) },
      dirCounts: { parent: dirOp.parent.length, child: dirOp.child.length, relatedOnly: dirOp.relatedOnly.length },
      opacityAll: medianOf(allOp), residue: { f: fCls, hopVar: hopVar }
    };
  }
  function focusState() { return focusProbe(); }

  /* ---------- 视口补间（fitView 不再瞬间跳变） ---------- */
  var VT = null, vraf = 0, vtim = 0, vtok = 0;
  function viewportTarget() {
    if (VT) return { x: VT.to.x, y: VT.to.y, k: VT.to.k };
    if (S.lt) return { x: S.lt.x, y: S.lt.y, k: S.lt.k };
    return { x: S.viewport.x, y: S.viewport.y, k: S.viewport.k };
  }
  function killRaf() { if (vraf) { try { cancelAnimationFrame(vraf); } catch (e) { } vraf = 0; } }
  function killTim() { if (vtim) { clearTimeout(vtim); vtim = 0; } }
  function stopTween() { VT = null; vtok++; killRaf(); killTim(); }
  /* 目标在启动时一次算定，插值过程中不再重算 → 不会抖 */
  function animateViewport(tx, ty, tk, dur) {
    S.lt = { x: tx, y: ty, k: tk };
    stopTween();
    VT = { from: { x: S.viewport.x, y: S.viewport.y, k: S.viewport.k }, to: S.lt, t0: perfNow(), dur: dur == null ? 260 : dur };
    scheduleTick();
  }
  /* 优先 rAF（真实浏览器 60fps）；某些无渲染环境（headless --dump-dom）rAF 不 tick，
     用 24ms 定时器兜底推进同一个 step，保证补间一定走到终点、最终值精确等于目标值 */
  function scheduleTick() {
    if (!VT) return;
    var tok = ++vtok;
    killRaf(); killTim();
    if (typeof requestAnimationFrame === 'function') {
      vraf = requestAnimationFrame(function () { if (tok === vtok) { vraf = 0; stepTween(); } });
    }
    vtim = setTimeout(function () { if (tok !== vtok) return; killRaf(); stepTween(); }, 24);
  }
  function stepTween() {
    if (!VT) return;

  }
  /* 优先级：已点亮 label > 当前 frontier > 灰影回声 > 其它已映射（高优先级先占位）。
     与已放置文字重叠超过较小文字面积的 8%、越出画布、或压到底部输入区 → 只隐藏这一个节点；
     因此低优先级的未点亮提示永远不会压住已点亮概念的名字（宁可少给提示） */
  function layoutHints() {
    var w = window.innerWidth, h = window.innerHeight;
    var k = S.viewport.k, ox = S.viewport.x, oy = S.viewport.y;
    var dt = dockTop();
    var UB = usableRect();            /* 标签与星点同一套边界：不许压 HUD、不许钻到输入条下面 */
    var sc = Math.max(SC_MIN, Math.min(2.6, 1 / k));
    var items = [];
    NODES.forEach(function (n) {
      var el = n.el; if (!el) return;
      var st = el.getAttribute('data-state');
      if (st !== 'lit' && st !== 'mapped' && st !== 'echo' && st !== 'review') return;
      var txt = n.elHint.textContent; if (!txt) return;
      var p = POS.get(n.id); if (!p) return;
      var fs = (st === 'lit' || st === 'review') ? FS_LAB : FS_HINT;
      /* 占位估算必须与 CSS 一致，否则碰撞检测算的是「不存在的文字框」，
         会把真重叠漏掉（旧版 hint-right/above 估位偏差 12px，实测 11 对提示互相压字） */
      items.push({
        el: el, x: p.x * k + ox, y: p.y * k + oy, fs: fs,
        w: Math.min(textW(txt, fs), (st === 'lit' || st === 'review') ? LAB_MAX : HINT_MAX),
        rank: (n.id === ACTIVE_ID ? -2 : (st === 'lit' ? 0 : (isFrontier(n.id) ? 1 : (st === 'echo' ? 2 : 3)))),
        state: st, level: n.level, id: n.id
      });
    });
    items.sort(function (a, b) {
      return a.rank - b.rank || a.level - b.level || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
    });
    var placed = [], kept = [], shown = 0, hidden = 0;
    function free(r) {
      if (!(r.l >= UB.l && r.r <= UB.r && r.t >= UB.t && r.b <= dt - 10)) return false;
      for (var i = 0; i < placed.length; i++) {
        var o = placed[i];
        var ow = Math.min(r.r, o.r) - Math.max(r.l, o.l);
        var oh = Math.min(r.b, o.b) - Math.max(r.t, o.t);
        if (ow > 0 && oh > 0) {
          var ov = ow * oh;
          var minA = Math.min((r.r - r.l) * (r.b - r.t), (o.r - o.l) * (o.b - o.t));
          if (ov > minA * (S.review ? 0.26 : 0.08)) return false;   /* 复盘态放宽：答案卷宁可挤一点也不藏名字 */
        }
      }
      return true;
    }
    items.forEach(function (it) {
      var H = Math.round(it.fs * 1.32 * 100) / 100;   /* 实测行高：14→18.5 / 12.5→16.5 */
      /* 候选位置：正下方 / 正上方 / 右侧 / 左侧（密集环里靠换位把提示排开，而不是直接隐藏） */
      /* CSS 里的 12px/14px/11px 是 #world 局部像素，渲染时被整体 scale(k) 放大 → 视觉间隔必须再乘 k */
      var w = it.w, gapD = 12 * sc * k, gapU = 14 * sc * k, gapS = 11 * sc * k;
      var cands = [
        { l: it.x - w / 2, t: it.y + gapD, r: it.x + w / 2, b: it.y + gapD + H, shift: 0, vy: 0 },
        { l: it.x - w / 2, t: it.y - gapU - H, r: it.x + w / 2, b: it.y - gapU, shift: 0, vy: -1 },
        { l: it.x + gapS, t: it.y - H / 2, r: it.x + gapS + w, b: it.y + H / 2, shift: 1, vy: 0 },
        { l: it.x - gapS - w, t: it.y - H / 2, r: it.x - gapS, b: it.y + H / 2, shift: -1, vy: 0 }
      ];
      var pickR = null, pickC = null;
      for (var c = 0; c < cands.length; c++) { if (free(cands[c])) { pickR = cands[c]; pickC = cands[c]; break; } }
      var ok = !!pickR;
      if (ok) {
        placed.push(pickR);
        kept.push({ id: it.id, state: it.state, rank: it.rank, rect: pickR });
        shown++;
        /* 换位摆放用 class 控制（CSS 里 nohint / hint 的四种位置变体） */
        it.el.classList.remove('hint-above', 'hint-right', 'hint-left');
        if (pickC.shift === 1) it.el.classList.add('hint-right');
        else if (pickC.shift === -1) it.el.classList.add('hint-left');
        else if (pickC.vy === -1) it.el.classList.add('hint-above');
      } else hidden++;
      it.el.classList.toggle('nohint', !ok);
    });
    S.hintStats = { shown: shown, hidden: hidden, kept: kept };
  }

  var canvas = document.getElementById('bg');
  var ctx = canvas.getContext('2d');
  var DPR = 1;

  function resizeCanvas() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    var w = window.innerWidth, h = window.innerHeight;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  /* D4：related 连线的样式常量（drawCanvas 与 ?measure=1 共用，避免两处漂移） */
  var REL_STYLE = { dash: [5, 5], width: 1.5, alphaBoth: 0.80, alphaOne: 0.52, alphaNone: 0.30, rgb: '127,214,255' };
  /* 点亮树边的虚线流光常量：实线打底之上叠一层父→子方向滚动的高亮虚线；on=false 一键回退为原实线 */
  var TREE_FLOW_STYLE = { on: true, dash: [6, 10], speed: 0.03, rgb: '255,230,190' };
  /* V23 连线阶梯：档位按「两端里较小的 hop」定，related 再 ×0.85；无焦点时倍率恒为 1（完全等于旧画面） */
  function baseEdgeAlpha(a, b, related) {
    var la = S.litSet.has(a), lb = S.litSet.has(b);
    if (related) return (la && lb) ? REL_STYLE.alphaBoth : ((la || lb) ? REL_STYLE.alphaOne : REL_STYLE.alphaNone);
    var al = (la && lb) ? 0.58 : ((la || lb) ? 0.22 : 0.055);
    if (S.review && !la && !lb) al = 0.30;
    return al;
  }
  function baseEdgeWidth(la, lb) { return (la && lb) ? 1.8 : ((la || lb) ? 1.2 : 1); }
  function edgeHop(a, b) {
    if (!FOCUS_ID) return -1;
    var h = Math.min(hopOf(a), hopOf(b));
    return h > 3 ? 3 : h;
  }
  function edgeMul(a, b, related) {
    var h = edgeHop(a, b);
    if (h < 0) return 1;
    return ladderCfg().edge[h] * (related ? 0.85 : 1);
  }
  function edgeWiden(a, b) {
    var h = edgeHop(a, b);
    return h < 0 ? 1 : ladderCfg().ew[h];
  }

  var DUST = [], SPARKS = [];
  function seedDust() {
    DUST.length = 0; SPARKS.length = 0;
    var w = window.innerWidth, h = window.innerHeight;
    for (var i = 0; i < 190; i++) {
      DUST.push({
        x: Math.random() * w, y: Math.random() * h,
        r: 0.35 + Math.random() * 1.35,
        a: 0.05 + Math.random() * 0.28,
        warm: Math.random() < 0.16,
        vx: (Math.random() - 0.5) * 0.09,
        vy: (Math.random() - 0.5) * 0.085,
        ph: Math.random() * TAU,
        sp: 0.35 + Math.random() * 1.3
      });
    }
    /* 少量带十字星芒的亮星：背景多一层纵深，不会抢节点的戏 */
    for (var s = 0; s < 12; s++) {
      SPARKS.push({
        x: Math.random() * w, y: Math.random() * h,
        r: 1.1 + Math.random() * 1.4,
        a: 0.22 + Math.random() * 0.30,
        ph: Math.random() * TAU,
        sp: 0.12 + Math.random() * 0.4
      });
    }
  }

  function drawCanvas(t) {
    var W = window.innerWidth, H = window.innerHeight;
    var vp = S.viewport, k = vp.k, ox = vp.x, oy = vp.y;
    ctx.clearRect(0, 0, W, H);

    /* 星尘 */
    for (var i = 0; i < DUST.length; i++) {
      var d = DUST[i];
      d.x += d.vx; d.y += d.vy;
      if (d.x < -6) d.x = W + 6; else if (d.x > W + 6) d.x = -6;
      if (d.y < -6) d.y = H + 6; else if (d.y > H + 6) d.y = -6;
      var tw = 0.55 + 0.45 * Math.sin(t * 0.001 * d.sp + d.ph);
      ctx.globalAlpha = d.a * tw;
      ctx.fillStyle = d.warm ? '#ffd7ab' : '#d2e3ff';
      ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, TAU); ctx.fill();
    }
    /* 星芒亮星 */
    for (var s2 = 0; s2 < SPARKS.length; s2++) {
      var sp = SPARKS[s2];
      var tw2 = 0.55 + 0.45 * Math.sin(t * 0.001 * sp.sp + sp.ph);
      ctx.globalAlpha = sp.a * tw2;
      ctx.strokeStyle = '#ecf4ff';
      ctx.lineWidth = 1;
      var len = sp.r * 4.2;
      ctx.beginPath();
      ctx.moveTo(sp.x - len, sp.y); ctx.lineTo(sp.x + len, sp.y);
      ctx.moveTo(sp.x, sp.y - len); ctx.lineTo(sp.x, sp.y + len);
      ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(sp.x, sp.y, sp.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;

    /* V8 / D4 related 冷色虚线（先画，压在暖线下面）：冷青 #7fd6ff、alpha ≥0.5、线宽 1.5、dash 5/5
       新增：虚线缓慢流动 + 悬停/拖拽节点的关联线加亮，拖节点时能一眼看出「牵着谁」 */
    ctx.setLineDash(REL_STYLE.dash);
    ctx.lineDashOffset = -(t * 0.018) % 20;
    ctx.lineCap = 'round';
    ctx.lineWidth = REL_STYLE.width;
    for (var r = 0; r < edgeRel.length; r++) {
      var ra = edgeRel[r][0], rb = edgeRel[r][1];
      if (!S.review && (!S.mapped.has(ra) || !S.mapped.has(rb))) continue;   /* 复盘揭晓：12 条 related 全画出来 */
      var A = POS.get(ra), B = POS.get(rb);
      if (!A || !B) continue;
      var al = baseEdgeAlpha(ra, rb, true);
      var act = !!FOCUS_ID && (ra === FOCUS_ID || rb === FOCUS_ID);
      al *= edgeMul(ra, rb, true);                   /* V23：hop 越低越亮，related 再 ×0.85 */
      if (act) al = Math.min(1, al + 0.32);
      var fk = ra + '>' + rb;
      var fl = FLASH.get(fk);
      if (fl != null) {
        var pr = (t - fl) / 1200;
        if (pr < 1) al = Math.min(1, al + 0.5 * (1 - pr)); else FLASH.delete(fk);
      }
      ctx.strokeStyle = 'rgba(' + REL_STYLE.rgb + ',' + al.toFixed(3) + ')';
      ctx.lineWidth = act ? 2.2 : REL_STYLE.width * edgeWiden(ra, rb);
      if (act) {
        /* 关联线外发光：拖拽/悬停时能看出这条线牵着谁 */
        ctx.strokeStyle = 'rgba(' + REL_STYLE.rgb + ',' + (al * 0.16).toFixed(3) + ')';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(A.x * k + ox, A.y * k + oy);
        ctx.lineTo(B.x * k + ox, B.y * k + oy);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(' + REL_STYLE.rgb + ',' + al.toFixed(3) + ')';
        ctx.lineWidth = 2.2;
      }
      ctx.beginPath();
      ctx.moveTo(A.x * k + ox, A.y * k + oy);
      ctx.lineTo(B.x * k + ox, B.y * k + oy);
      ctx.stroke();
    }
    ctx.setLineDash([]);

    /* V8 tree 暖色实线 */
    for (var e = 0; e < edgeTree.length; e++) {
      var ta = edgeTree[e][0], tb = edgeTree[e][1];
      var ghostEdge = GHOST_LINE_A > 0.001 && !S.mapped.has(ta) && !S.mapped.has(tb);
      if (!S.review && !ghostEdge && (!S.mapped.has(ta) || !S.mapped.has(tb))) continue;   /* 复盘揭晓：99 条树边全画出来 */
      var A2 = POS.get(ta), B2 = POS.get(tb);
      if (!A2 || !B2) continue;
      var la2 = S.litSet.has(ta), lb2 = S.litSet.has(tb);
      var al2 = baseEdgeAlpha(ta, tb, false);   /* 复盘：未点亮的两端也要看得见，但仍比已点亮骨架淡 */
      /* 入场幽灵骨架：亮度跟随幽灵点 alpha（满值 0.12 → 线 alpha 0.09），只画轮廓不画名字 */
      if (ghostEdge) al2 = Math.min(al2, GHOST_LINE_A * 0.75);
      /* 呼吸：极缓慢的明暗起伏，让已点亮的骨架线有生命感 */
      al2 *= 0.94 + 0.06 * Math.sin(t * 0.0009 + e * 1.7);
      al2 *= edgeMul(ta, tb, false);                 /* V23：hop 阶梯（无焦点时恒 1） */
      var act2 = !!FOCUS_ID && (ta === FOCUS_ID || tb === FOCUS_ID);
      if (act2) al2 = Math.min(1, al2 + 0.26);
      var fk2 = ta + '>' + tb;
      var fl2 = FLASH.get(fk2);
      if (fl2 != null) {
        var pr2 = (t - fl2) / 1200;
        if (pr2 < 1) al2 = Math.min(1, al2 + 0.6 * (1 - pr2)); else FLASH.delete(fk2);
      }
      var w2 = baseEdgeWidth(la2, lb2) * edgeWiden(ta, tb);
      if (act2) w2 = Math.max(2.2, w2);
      var tx1 = A2.x * k + ox, ty1 = A2.y * k + oy, tx2 = B2.x * k + ox, ty2 = B2.y * k + oy;
      if ((la2 && lb2) || act2) {
        /* 已点亮骨架的柔光外晕（低透明度宽描边，比 shadowBlur 便宜） */
        ctx.strokeStyle = 'rgba(255,170,88,' + (al2 * 0.10).toFixed(3) + ')';
        ctx.lineWidth = w2 * 4.4;
        ctx.beginPath(); ctx.moveTo(tx1, ty1); ctx.lineTo(tx2, ty2); ctx.stroke();
      }
      ctx.lineWidth = w2;
      ctx.strokeStyle = 'rgba(255,206,148,' + al2.toFixed(3) + ')';
      ctx.beginPath();
      ctx.moveTo(tx1, ty1);
      ctx.lineTo(tx2, ty2);
      ctx.stroke();
      if (TREE_FLOW_STYLE.on && la2 && lb2 && !ghostEdge) {
        /* 虚线流光：只叠在双端点亮的树边上，父→子方向滚动；一端亮/未点亮/幽灵线保持实线，不多给信息 */
        ctx.save();
        ctx.setLineDash(TREE_FLOW_STYLE.dash);
        ctx.lineDashOffset = -(t * TREE_FLOW_STYLE.speed) % 16;
        ctx.lineWidth = w2;
        ctx.strokeStyle = 'rgba(' + TREE_FLOW_STYLE.rgb + ',' + Math.min(1, al2 + 0.27).toFixed(3) + ')';
        ctx.beginPath();
        ctx.moveTo(tx1, ty1);
        ctx.lineTo(tx2, ty2);
        ctx.stroke();
        ctx.restore();
      }
    }

    /* 拖拽牵线：虚线从原位锚点连到节点当前位置，明确「连线跟着节点走」 */
    if (ND) {
      var nbp = BASE.get(ND.id), ncp = POS.get(ND.id);
      if (nbp && ncp) {
        ctx.save();
        ctx.setLineDash([4, 6]);
        ctx.lineDashOffset = -(t * 0.03) % 10;
        ctx.strokeStyle = 'rgba(255,206,150,0.40)';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(nbp.x * k + ox, nbp.y * k + oy);
        ctx.lineTo(ncp.x * k + ox, ncp.y * k + oy);
        ctx.stroke();
        ctx.restore();
      }
    }

    /* 光沿连线跑动 */
    for (var f2 = FLIGHTS.length - 1; f2 >= 0; f2--) {
      var f = FLIGHTS[f2];
      var p2 = (t - f.t0) / f.dur;
      if (p2 >= 1) { FLIGHTS.splice(f2, 1); continue; }
      var PA = POS.get(f.a), PB = POS.get(f.b);
      if (!PA || !PB) { FLIGHTS.splice(f2, 1); continue; }
      var ee = 1 - Math.pow(1 - p2, 2.2);
      var x = (PA.x + (PB.x - PA.x) * ee) * k + ox;
      var y = (PA.y + (PB.y - PA.y) * ee) * k + oy;
      /* 流星尾迹：点亮瞬间的光点带一小段拖尾 */
      var e0 = 1 - Math.pow(1 - Math.max(0, p2 - 0.14), 2.2);
      var x0 = (PA.x + (PB.x - PA.x) * e0) * k + ox;
      var y0 = (PA.y + (PB.y - PA.y) * e0) * k + oy;
      ctx.strokeStyle = 'rgba(255,214,164,' + (0.40 * (1 - p2)).toFixed(3) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x, y); ctx.stroke();
      var g = ctx.createRadialGradient(x, y, 0, x, y, 15);
      g.addColorStop(0, 'rgba(255,246,224,0.95)');
      g.addColorStop(0.35, 'rgba(255,193,124,0.55)');
      g.addColorStop(1, 'rgba(255,140,60,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, 15, 0, TAU); ctx.fill();
    }
  }

  function frame(t) {
    drawCanvas(t);
    requestAnimationFrame(frame);
  }

  /* =========================================================
     10. 结算 / 导出
     ========================================================= */
  function settlement() {
    var correct = S.lit.length;
    var total = correct + S.wrong;
    return {
      chapter: META.chapter || '',
      difficulty: S.difficulty,
      litCount: correct,
      totalNodes: NODES.length,
      wrongCount: S.wrong,
      submissions: total,
      accuracy: total > 0 ? correct / total : 0,
      durationMs: Math.max(0, now() - S.startedAt),
      startedAt: S.startedAt,
      entries: S.lit.map(function (x) {
        var n = byId.get(x.id) || {};
        return {
          order: x.order, id: x.id, label: n.label || '',
          level: n.level, jump: !!x.jump,
          ts: x.ts, atMs: Math.max(0, x.ts - S.startedAt)
        };
      })
    };
  }

  function buildExport(mode) {
    var s = settlement();
    if (mode === 'json') {
      return JSON.stringify({
        chapter: s.chapter, difficulty: s.difficulty,
        litCount: s.litCount, totalNodes: s.totalNodes,
        wrongCount: s.wrongCount, submissions: s.submissions,
        accuracy: Math.round(s.accuracy * 10000) / 100 + '%',
        durationMs: s.durationMs, duration: fmtDur(s.durationMs),
        generatedAt: new Date().toISOString(),
        entries: s.entries
      }, null, 2);
    }
    var lines = [];
    lines.push('意识星图 · 回忆结算');
    lines.push('章节：' + s.chapter);
    lines.push('难度：' + s.difficulty);
    lines.push('已点亮：' + s.litCount + ' / ' + s.totalNodes);
    lines.push('错误次数：' + s.wrongCount);
    lines.push('提交次数：' + s.submissions);
    lines.push('准确率：' + (Math.round(s.accuracy * 1000) / 10) + '%');
    lines.push('耗时：' + fmtDur(s.durationMs));
    lines.push('---');
    s.entries.forEach(function (e) {
      lines.push(e.order + '. ' + e.label + (e.jump ? '  [跳层]' : '') + '  ' + fmtDur(e.atMs));
    });
    return lines.join('\n');
  }

  function download(name, text, mime) {
    var blob = new Blob([text], { type: mime + ';charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2500);
  }

  function openPanel() {
    var s = settlement();
    var stats = document.getElementById('stats');
    stats.innerHTML =
      '<div><span>已点亮</span><b>' + s.litCount + ' / ' + s.totalNodes + '</b></div>' +
      '<div><span>错误次数</span><b>' + s.wrongCount + '</b></div>' +
      '<div><span>准确率</span><b>' + (Math.round(s.accuracy * 1000) / 10) + '%</b></div>' +
      '<div><span>耗时</span><b>' + fmtDur(s.durationMs) + '</b></div>';
    document.getElementById('panel-sub').textContent = s.chapter + ' · ' + s.difficulty;
    var tb = document.querySelector('#list tbody');
    tb.innerHTML = s.entries.map(function (e) {
      return '<tr><td class="num">' + e.order + '</td><td>' + esc(e.label) + '</td>' +
        '<td class="tag">' + (e.jump ? '跳层' : '') + '</td>' +
        '<td class="tm">' + fmtDur(e.atMs) + '</td></tr>';
    }).join('') || '<tr><td colspan="4" style="color:#7f8ea6;padding:14px">还没有点亮任何节点</td></tr>';
    document.getElementById('panel').classList.add('open');
  }

  /* =========================================================
     11. 启动
     ========================================================= */
  function startGame(diff, opts) {
    resetMemory(diff);
    migrateSaves();
    var loaded = loadSave();
    if (!loaded) {
      lightNode(ROOT_ID, { jump: false, silent: true });
      saveNow();
    }
    syncDiffButtons();
    refreshAll();
    if (!S.userMoved) fitView();
    applyViewport();
    var t = document.getElementById('hud-time');
    if (t) t.textContent = fmtDur(now() - S.startedAt);
    /* 入场镜头：新档 / 续档 / 切档 / ?reset=1 都播；复盘态、?selftest、?nointro、reduced-motion 不播 */
    if (!(opts && opts.intro === false)) introStart(false);
  }

  function bindEvents() {

    document.addEventListener('pointerdown', function (e) {

    /* 滚轮缩放 */
    window.addEventListener('wheel', function (e) {
      if (e.target.closest && e.target.closest('#panel, #hud, #selftest-report')) return;
      if (ND) return;                       /* 拖节点时锁住缩放，避免拖拽与视口同时变 */
      e.preventDefault();
      var k0 = S.viewport.k;
      var k1 = clamp(k0 * Math.exp(-e.deltaY * 0.0016), 0.16, 3.4);
      var sc = k1 / k0;

      S.viewport.x = e.clientX - (e.clientX - S.viewport.x) * sc;
      S.viewport.y = e.clientY - (e.clientY - S.viewport.y) * sc;

    /* 拖拽平移 */
    var drag = null;

    });
    document.addEventListener('pointermove', function (e) {

      S.viewport.y = drag.vy + (e.clientY - drag.y);
      S.userMoved = true;
      applyViewport();
    });
    document.addEventListener('pointerup', function () {
      if (ND) { endNodeDrag(); return; }
      if (drag) { drag = null; scheduleSave(); }
    });
    document.addEventListener('pointercancel', function () {
      if (ND) endNodeDrag();
      if (drag) { drag = null; scheduleSave(); }
    });

    window.addEventListener('dblclick', function (e) {
      if (e.target.closest && e.target.closest('#hud, #dock, #panel')) return;
      fitView();
      S.userMoved = false;
      scheduleSave();
    });

    window.addEventListener('resize', function () {
      resizeCanvas();
      if (!S.userMoved) fitView();
      applyViewport();
    });
  }

  async function runSelftest() {
    var lines = [];
    var pass = 0, fail = 0;
    var bootDiff = S.difficulty;   /* 本次运行真实生效的档位（收尾时会被测试切到 standard，故先取） */
    function ck(name, cond, detail) {
      if (cond) { pass++; lines.push('PASS  ' + name + (detail ? '   | ' + detail : '')); }
      else { fail++; lines.push('FAIL  ' + name + (detail ? '   | ' + detail : '')); }
    }
    function guard(name, fn) {
      try { fn(); } catch (e) { fail++; lines.push('FAIL  ' + name + '   | 异常: ' + (e && e.message ? e.message : e)); }
    }
    var H = window.__star;
    function stateOf(id) { var n = byId.get(id); return n && n.el ? n.el.getAttribute('data-state') : '<none>'; }
    function hintOf(id) { var n = byId.get(id); return n && n.elHint ? n.elHint.textContent : '<none>'; }
    function frontier() { return NODES.filter(function (n) { return isFrontier(n.id); }); }
    function keysOf(n) {
      var out = [];
      (n.keywords || []).forEach(function (k) { var t = normalize(k); if (t.length >= 2) out.push(t); });
      var l = normalize(n.label); if (l.length >= 2) out.push(l);
      return out;
    }
    /* 在给定池子里找一个「唯一命中」的 (节点, 关键词) */
    function findUnique(pool) {
      var cands = candidateNodes();
      for (var i = 0; i < pool.length; i++) {
        var n = byId.get(pool[i].id || pool[i]);
        if (!n) continue;
        var ks = keysOf(n);
        for (var j = 0; j < ks.length; j++) {
          var hits = cands.filter(function (x) { return nodeMatches(x, ks[j]); });
          if (hits.length === 1 && hits[0].id === n.id) return { id: n.id, kw: ks[j] };
        }
      }
      return null;
    }

    guard('S1 开局只有根节点点亮', function () {
      ck('S1 开局只有根节点点亮', S.lit.length === 1 && S.litSet.has(ROOT_ID) && S.lit[0].id === ROOT_ID,
        'lit=' + S.lit.length + ' root=' + ROOT_ID);
    });
    var rootKids = (childMap.get(ROOT_ID) || []).slice();
    /* 根的出度以数据为准（edges.tree 里根的边数），不写死数字 */
    var rootOutDeg = ((RAW.edges && RAW.edges.tree) || []).filter(function (e) { return e[0] === ROOT_ID; }).length;
    guard('S2 根的邻居以暗光点映射出来（数量 = tree 边里根的出度）', function () {
      var mapped = rootKids.filter(function (id) { return S.mapped.has(id); });
      var hintOk = S.difficulty === 'hard' ? hintOf(rootKids[0]) === '' : hintOf(rootKids[0]).length > 0;
      ck('S2 根的邻居以暗光点映射出来（数量 = tree 边里根的出度）',
        rootKids.length > 0 && rootKids.length === rootOutDeg && mapped.length === rootKids.length &&
        stateOf(rootKids[0]) === 'mapped' && hintOk,
        'children=' + rootKids.length + ' treeOutDeg=' + rootOutDeg + ' mapped=' + mapped.length +
        ' state=' + stateOf(rootKids[0]) + ' hint="' + hintOf(rootKids[0]) + '" (difficulty=' + S.difficulty + ')');
    });
    guard('S3 根节点为 lit + root（呼吸柔光）', function () {
      var el = byId.get(ROOT_ID).el;
      ck('S3 根节点为 lit + root（呼吸柔光）',
        el.getAttribute('data-state') === 'lit' && el.className.indexOf('root') >= 0 && !!el.querySelector('.halo'),
        'class="' + el.className + '"');
    });

    /* ---------- S4-S5 宽松匹配 D5 ---------- */
    guard('S4 规范化：去首尾/内部空格与标点、转小写', function () {
      var a = H.normalize('  A-Bc !  ');
      var b = H.normalize('A bc');
      var c = H.normalize('特异投射，系统？');
      ck('S4 规范化：去首尾/内部空格与标点、转小写',
        a === 'abc' && b === 'abc' && c === '特异投射系统', '"A-Bc !"->' + a + ' | "A bc"->' + b + ' | "特异投射，系统？"->' + c);

      var inKey = nodeMatches(target, normalize(head));

    guard('S6 歧义: 同级并列取 id 字典序 + ambiguous 标记', function () {

    var lit1 = null;
    guard('S7 猜对 -> 点亮并立刻展开它自己的邻居', function () {

      var t = findUnique(withKids.length ? withKids : frontier());

      var res = H.submit(t.kw);
      var kids = childMap.get(t.id) || [];
      var mappedKids = kids.filter(function (id) { return S.mapped.has(id); });
      ck('S7 猜对 -> 点亮并立刻展开它自己的邻居',
        res.ok === true && res.id === t.id && S.lit.length === before + 1 && stateOf(t.id) === 'lit' &&
        mappedKids.length === kids.length,
        'kw="' + t.kw + '" id=' + t.id + ' lit=' + S.lit.length + ' 子节点 ' + mappedKids.length + '/' + kids.length + ' 已映射');
    });

    /* ---------- S8-S9 歧义：frontier 优先 / level 最小 ---------- */
    guard('S8 歧义: frontier 优先于尚未映射的节点', function () {
      var deep = NODES.filter(function (n) { return n.level >= 3 && !S.mapped.has(n.id); })[0];
      var f = frontier()[0];
      if (!deep || !f) { ck('S8 歧义: frontier 优先于尚未映射的节点', false, '样例不足'); return; }
      var r = H.resolveOf([deep.id, f.id]);
      ck('S8 歧义: frontier 优先于尚未映射的节点', r.node.id === f.id,
        'deep=' + deep.id + '(mapped=' + S.mapped.has(deep.id) + ') frontier=' + f.id + ' -> picked=' + r.node.id);
    });
    guard('S9 歧义: 都在 frontier 时取 level 最小', function () {
      var f = frontier();

      var deeper = f.filter(function (n) { return n.level >= 2; })[0];
      if (!shallow || !deeper) { ck('S9 歧义: 都在 frontier 时取 level 最小', false, '层次样例不足'); return; }
      var r = H.resolveOf([deeper.id, shallow.id]);

    guard('S10 真实歧义提交并提示「匹配到多个，取其一」', function () {
      var f = frontier().filter(function (n) { return n.level === 1; });
      if (f.length < 2) { ck('S10 真实歧义提交并提示「匹配到多个，取其一」', false, '同级 frontier 不足 2 个'); return; }

        res = H.submit(TAG);

      } finally {

      }

  function runDemo(n, skipJump, jumps) {
    function keysOf(n) {
      var out = [];
      (n.keywords || []).forEach(function (k) { var t = normalize(k); if (t.length >= 2) out.push(t); });
      var l = normalize(n.label); if (l.length >= 2) out.push(l);

    }

      var cands = candidateNodes();
      for (var i = 0; i < pool.length; i++) {
        var nd = pool[i], ks = keysOf(nd);
        for (var j = 0; j < ks.length; j++) {
          var hits = cands.filter(function (x) { return nodeMatches(x, ks[j]); });
          if (hits.length === 1 && hits[0].id === nd.id) return { id: nd.id, kw: ks[j] };
        }

      return null;
    }
    var done = 0, rounds = 0;
    while (done < n && rounds++ < n * 14) {

      var withKids = f.filter(function (x) { return (childMap.get(x.id) || []).length > 0; });
      var t = pick(withKids.length ? withKids : f);
      if (!t) break;

        if (x.level < 2 || S.mapped.has(x.id) || S.litSet.has(x.id)) return;

      if (!j) break;
      submitGuess(j.kw);

            (rootX - cw / 2).toFixed(1) + ', ' + (rootY - ch / 2).toFixed(1) + ')',
          'L1 mapped n=' + pts.length + '  bbox = ' + (b.maxX - b.minX).toFixed(1) + ' x ' + (b.maxY - b.minY).toFixed(1) +
            '  x[' + b.minX.toFixed(1) + '..' + b.maxX.toFixed(1) + ']  y[' + b.minY.toFixed(1) + '..' + b.maxY.toFixed(1) + ']',
          'L1 min pairwise gap = ' + (isFinite(minGap) ? minGap.toFixed(1) : 'n/a'),
          'zoom k = ' + S.viewport.k.toFixed(3) + '   mapped dot = ' + dotM.width.toFixed(1) + 'px   lit dot = ' + dotL.width.toFixed(1) + 'px',
          'root halo box = ' + HALO.width.toFixed(1) + 'px (radius ' + (HALO.width / 2).toFixed(1) + ')',
          'font: mapped hint = ' + hintFs + '   lit/root label = ' + labFs + '   (screen px)',
          'diag: world transform = ' + getComputedStyle(world).transform + '   viewport = {x:' + S.viewport.x.toFixed(1) + ' y:' + S.viewport.y.toFixed(1) + ' k:' + S.viewport.k.toFixed(3) + '}   root POS = ' +
            JSON.stringify(POS.get(ROOT_ID)) + '   root el transform = ' + byId.get(ROOT_ID).el.style.transform,
          (function () {
            var kk = (childMap.get(ROOT_ID) || [])[0];
            var el = byId.get(kk).el, dot = el.querySelector('.dot'), hh = el.querySelector('.hint');
            var cs = getComputedStyle(el), cd = getComputedStyle(dot), chh = getComputedStyle(hh);
            return 'node0 ' + kk.slice(0, 12) + ' class="' + el.className + '" opacity=' + cs.opacity + ' display=' + cs.display +
              ' | dot w=' + cd.width + ' bg=' + cd.backgroundColor + ' op=' + cd.opacity +
              ' rect=' + JSON.stringify(dot.getBoundingClientRect()) +
              ' | hint fs=' + chh.fontSize + ' color=' + chh.color + ' display=' + chh.display + ' text="' + hh.textContent + '"' +
              ' | root dot rect=' + JSON.stringify(byId.get(ROOT_ID).el.querySelector('.dot').getBoundingClientRect()) +
              ' | halo rect=' + JSON.stringify(byId.get(ROOT_ID).el.querySelector('.halo').getBoundingClientRect()) +
              ' | halo cs w=' + getComputedStyle(byId.get(ROOT_ID).el.querySelector('.halo')).width + ' op=' + getComputedStyle(byId.get(ROOT_ID).el.querySelector('.halo')).opacity;
          })(),
          'jump switch: custom=' + (!!sw) + '  track=' + (sw ? sw.getBoundingClientRect().width.toFixed(1) + 'x' + sw.getBoundingClientRect().height.toFixed(1) : 'n/a') +
            '  native checkbox visible=' + (document.getElementById('jump').offsetWidth > 2),
          (function () {
            /* 保留区验收：所有可见节点圆心 y 的最大值（须 ≤ dockTop = 0.8h）与 HUD 命中数 */
            var dt = dockTop(), H = hudRect(), maxY = -Infinity, inHud = 0, worst = '';
            NODES.forEach(function (n) {
              var st = n.el ? n.el.getAttribute('data-state') : 'hidden';
              if (st !== 'lit' && st !== 'mapped' && st !== 'echo' && st !== 'review') return;
              var p2 = POS.get(n.id); if (!p2) return;
              var sx = p2.x * S.viewport.k + S.viewport.x, sy = p2.y * S.viewport.k + S.viewport.y;
              if (sy > maxY) { maxY = sy; worst = n.id.slice(0, 14); }
              if (sx > H.l && sx < H.r && sy > H.t && sy < H.b) inHud++;
            });
            var ovf = !!(S.fitInfo && S.fitInfo.mode === 'root-overflow');
            return 'reserve zones: dockTop=' + dt + '  node max y = ' + maxY.toFixed(1) + ' (' + worst + ')  verdict=' + (maxY <= dt ? 'PASS' : (ovf ? 'PASS(溢出模式,允许出画布,仍≤800)' : 'FAIL')) +
              '   nodes inside HUD = ' + inHud;
          })(),
          (function () {
            /* lead 收尾项 1 验收：k 下限 + 「已点亮∪邻居∪灰影」包围盒占画布宽比例 */
            var list = visibleList(), k = S.viewport.k;
            var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY2 = -Infinity;
            list.forEach(function (n) {
              var p3 = POS.get(n.id); if (!p3) return;
              var sx = p3.x * k + S.viewport.x, sy = p3.y * k + S.viewport.y;
              if (sx < minX) minX = sx; if (sx > maxX) maxX = sx;
              if (sy < minY) minY = sy; if (sy > maxY2) maxY2 = sy;
            });
            var bw = maxX - minX, bh = maxY2 - minY, wp = bw / window.innerWidth * 100;
            var info = S.fitInfo || { raw: k, mode: 'root' };
            var needW = list.length >= 20;
            return 'fit: k=' + k.toFixed(3) + ' (raw=' + info.raw.toFixed(3) + ' mode=' + info.mode + ')' +
              '  targets(lit+neighbors+echo)=' + list.length +
              '  bbox=' + bw.toFixed(1) + 'x' + bh.toFixed(1) +
              '  width=' + wp.toFixed(1) + '% of canvas' +
              '  y[' + minY.toFixed(0) + '..' + maxY2.toFixed(0) + ']' +
              '  verdict=' + (k >= 0.45 && (!needW || wp >= 65) ? 'PASS' : 'FAIL') + (needW ? '' : ' (宽占比仅中局判)');
          })(),
          (function () {
            /* lead 收尾项 2 验收：已点亮 label 被未点亮提示覆盖的实例数（须为 0） */
            var kept = (S.hintStats && S.hintStats.kept) || [];
            var lit = kept.filter(function (o) { return o.state === 'lit'; });
            var bad = 0, sample = '';
            kept.forEach(function (o) {
              if (o.state === 'lit') return;
              lit.forEach(function (r) {
                var ow = Math.min(o.rect.r, r.rect.r) - Math.max(o.rect.l, r.rect.l);
                var oh = Math.min(o.rect.b, r.rect.b) - Math.max(o.rect.t, r.rect.t);
                if (ow > 0 && oh > 0) { bad++; if (!sample) sample = o.id.slice(0, 14); }
              });
            });
            return 'labels: lit labels placed=' + lit.length + '  unlit-hint-over-lit-label=' + bad +
              (sample ? ' (' + sample + ')' : '') + '  tolerance=8%  verdict=' + (bad === 0 ? 'PASS' : 'FAIL');
          })(),
          (function () {
            /* lead 问题 3 验收：未点亮节点里仍能看到「第N层·X字」的比例 */
            var total = 0, visible = 0, easySample = '', noHintSample = '';
            NODES.forEach(function (n) {
              var st = n.el ? n.el.getAttribute('data-state') : 'hidden';
              if (st !== 'mapped' && st !== 'echo') return;
              var txt = n.elHint.textContent; if (!txt) return;
              total++;
              if (!n.el.classList.contains('nohint')) {
                visible++;
                if (S.difficulty === 'easy' && !easySample) easySample = txt;
              } else if (!noHintSample) noHintSample = txt;
            });
            return 'hints: unlit-with-text ' + visible + '/' + total + ' = ' + (total ? Math.round(visible * 100 / total) + '%' : 'n/a') +
              '  verdict=' + (total === 0 || visible / total >= 0.8 ? 'PASS' : 'FAIL') +
              '  screen fs = ' + FS_HINT + 'px (label ' + FS_LAB.toFixed(1) + 'px)' +
              '  easy sample = "' + easySample + '"   hidden sample = "' + noHintSample + '"';
          })(),
          'related style: dash=[' + REL_STYLE.dash.join(',') + '] width=' + REL_STYLE.width + ' alpha(lit/one/none)=' + REL_STYLE.alphaBoth + '/' + REL_STYLE.alphaOne + '/' + REL_STYLE.alphaNone + ' color=rgba(' + REL_STYLE.rgb + ')',
          'tree flow style: on=' + TREE_FLOW_STYLE.on + ' dash=[' + TREE_FLOW_STYLE.dash.join(',') + '] speed=' + TREE_FLOW_STYLE.speed + ' color=rgba(' + TREE_FLOW_STYLE.rgb + ')',
          (function () {
            var e = NODES.filter(function (n) { return S.echo.has(n.id); })[0];
            if (!e) return 'echo: none in this scene';
            var cd = getComputedStyle(e.el.querySelector('.dot'));
            var dr = e.el.querySelector('.dot').getBoundingClientRect();
            var kk = S.viewport.k;
            var bwScr = parseFloat(cd.borderTopWidth) * kk;
            var ringOuter = dr.width + 2 * (parseFloat(cd.outlineOffset || 0) + parseFloat(cd.outlineWidth || 0)) * kk;
            return 'echo: ' + e.label + '  border=' + cd.borderTopWidth + ' ' + cd.borderTopStyle + ' ' + cd.borderTopColor +
              '  borderScreen=' + bwScr.toFixed(2) + 'px  dotScreen=' + dr.width.toFixed(1) +
              'px  ringOuter=' + ringOuter.toFixed(1) + 'px  outline=' + cd.outlineStyle + ' ' + cd.outlineColor +
              '  bg=' + cd.backgroundColor + '  state=' + e.el.getAttribute('data-state') +
              '  rect=' + JSON.stringify(dr);
          })(),
          (function () {
            /* 长 label（≥13 字）排版：屏幕宽度硬上限 LAB_MAX，超出走省略号；不得与任何已点亮 label 重叠 */
            var longs = NODES.filter(function (n) { return S.litSet.has(n.id) && Array.from(n.label).length >= 13; });
            if (!longs.length) return 'long labels: none lit in this scene (数据里最长 18 字)';
            var out = [], worst = 0, overlap = 0;
            longs.forEach(function (n) {
              var r = n.elHint.getBoundingClientRect();
              var sw = n.elHint.scrollWidth * S.viewport.k, cw = r.width;
              var truncated = n.elHint.scrollWidth > n.elHint.clientWidth + 1;
              if (r.width > worst) worst = r.width;
              var hit = 0;
              NODES.forEach(function (o) {
                if (o.id === n.id || !S.litSet.has(o.id)) return;
                var q = o.elHint.getBoundingClientRect();
                if (Math.min(r.right, q.right) - Math.max(r.left, q.left) > 0 &&
                    Math.min(r.bottom, q.bottom) - Math.max(r.top, q.top) > 0) hit++;
              });
              overlap += hit;
              out.push('"' + n.label + '"(' + Array.from(n.label).length + '字, screenW=' + r.width.toFixed(1) +
                'px, full=' + sw.toFixed(1) + 'px, ellipsis=' + truncated + ', overlap=' + hit + ')');
            });
            return 'long labels: ' + out.join(' | ') + '   maxScreenW=' + worst.toFixed(1) + 'px cap=' + LAB_MAX +
              'px  overlaps=' + overlap + '  verdict=' + (worst <= LAB_MAX + 1 && overlap === 0 ? 'PASS' : 'FAIL');
          })()
        ];
        var pre2 = document.getElementById('selftest-report');
        pre2.textContent = lines2.join('\n');
        pre2.classList.add('show');
        document.title = 'MEASURE ok';
      } catch (e) { document.title = 'MEASURE ERROR ' + (e && e.message ? e.message : e); }
    }, 900);

    if (Q.get('selftest') === '1') {
      setTimeout(function () {
        try {
          var sp = runSelftest();
          if (sp && sp.catch) sp.catch(function (e) {
            var pr = document.getElementById("selftest-report");
            pr.classList.add("show");
            pr.textContent = "SELFTEST REJECTED: " + (e && e.stack ? e.stack : e);
            document.title = "SELFTEST: FAIL";
          });
        }
        catch (e) {
          var pre = document.getElementById('selftest-report');
          pre.classList.add('show');
          pre.textContent = 'SELFTEST CRASHED: ' + (e && e.stack ? e.stack : e);
          document.title = 'SELFTEST: FAIL';
        }
      }, 0);
    }
  })();
})();
</script>
</body>
</html>
