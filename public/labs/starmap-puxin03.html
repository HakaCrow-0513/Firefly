<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>意识星图 · 回忆</title>
<style>
:root{
  --ink:#dfe7f2;
  --dim:#7f8ea6;
  --warm:#ffd9a0;
  --warm2:#ff8a3d;
  --cool:#9fc4ff;
  --panel:rgba(10,16,26,.66);
  --line:rgba(120,160,220,.16);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;overflow:hidden;background:#05070d;color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Source Han Sans SC","Noto Sans CJK SC",sans-serif;
  -webkit-font-smoothing:antialiased;user-select:none;
}
#sky{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(880px 600px at 18% 10%, rgba(58,98,172,.20), rgba(58,98,172,0) 70%),
    radial-gradient(760px 520px at 84% 82%, rgba(92,116,196,.14), rgba(92,116,196,0) 72%),
    radial-gradient(520px 380px at 72% 18%, rgba(255,150,80,.07), rgba(255,150,80,0) 70%),
    radial-gradient(1200px 900px at 50% 42%, #101a2b 0%, #0a0f1a 40%, #05070d 78%, #03050a 100%);
}
#bg{position:fixed;inset:0;z-index:1;display:block}
#world{position:fixed;inset:0;z-index:2;transform-origin:0 0;will-change:transform}
#nodes{position:absolute;left:0;top:0;width:0;height:0}
/* 电影感暗角：只压边缘，不影响交互 */
#vignette{
  position:fixed;inset:0;z-index:4;pointer-events:none;
  background:radial-gradient(118% 96% at 50% 45%, rgba(2,4,9,0) 44%, rgba(2,4,9,.42) 84%, rgba(1,2,5,.72) 100%);
}

/* ---------- node ---------- */
.node{position:absolute;left:0;top:0;width:0;height:0;opacity:0;pointer-events:none;transition:opacity .55s ease}
.node.lit,.node.mapped,.node.echo,.node.review{opacity:1;pointer-events:auto;cursor:grab}
/* V23 悬停跳数阶梯：hop1..hop4 的真实不透明度走 --hop-op（值来自 JS 常量表，档位 soft/std/hard 可切） */
.node.f1,.node.f2,.node.f3,.node.f4{opacity:var(--hop-op,.9)}
/* 不可见的大命中区：小光点也能稳稳抓住（屏幕约 26px，不随缩放变小） */
.node .hit{
  position:absolute;left:0;top:0;width:calc(26px * var(--sc,1));height:calc(26px * var(--sc,1));
  margin:calc(-13px * var(--sc,1)) 0 0 calc(-13px * var(--sc,1));
  border-radius:50%;touch-action:none;
}
body.node-dragging,body.node-dragging *{cursor:grabbing!important}
.node.dragging{z-index:40}
.node.dragging .dot{transform:scale(1.42);filter:brightness(1.22)}
.node.dragging .halo{opacity:1}
.node.dragging .hint{color:#fff4e2}
/* 拖拽时的原位锚点：双击节点即可回到这里 */
.anchor{
  position:absolute;left:0;top:0;border-radius:50%;pointer-events:none;
  border:1px dashed rgba(255,205,150,.6);background:rgba(255,190,120,.07);
  box-shadow:0 0 18px rgba(255,170,90,.16);
  animation:anchorPulse 1.9s ease-in-out infinite;
}
@keyframes anchorPulse{0%,100%{transform:scale(.94);opacity:.5}50%{transform:scale(1.06);opacity:.92}}
/* 悬停：光点轻轻放大并提亮，暗示「可以抓住」 */
@media (hover:hover){
  .node.lit:hover .dot{transform:scale(1.16);filter:brightness(1.08)}
  .node.mapped:hover .dot,.node.echo:hover .dot{
    transform:scale(1.34);
    box-shadow:0 0 16px rgba(176,214,255,.95),0 0 30px rgba(120,176,246,.62);
  }
  .node:hover .hint{color:rgba(255,244,226,.96)}
}
.node .dot{
  position:absolute;left:0;top:0;width:calc(8px * var(--sc,1));height:calc(8px * var(--sc,1));margin:calc(-4px * var(--sc,1)) 0 0 calc(-4px * var(--sc,1));border-radius:50%;
  background:rgba(216,234,255,.88);box-shadow:0 0 8px rgba(150,190,245,.72),0 0 18px rgba(110,165,235,.36);
  transition:all .5s ease,transform .18s ease,filter .2s ease;
}
/* 未点亮（已映射）：冷白淡蓝光点，核心 3.5px + 7–8px 外晕，一眼可见 */
.node.mapped .dot{background:rgba(226,240,255,.84);box-shadow:0 0 7px rgba(160,200,250,.62), 0 0 16px rgba(110,170,240,.28)}
.node.echo .dot{
  width:var(--ec-sz,19px);height:var(--ec-sz,19px);
  margin:calc(var(--ec-sz,19px) / -2) 0 0 calc(var(--ec-sz,19px) / -2);
  background:rgba(134,162,206,.30);
  border:var(--ec-bw,2px) dashed rgba(200,224,255,.95);
  box-shadow:0 0 16px rgba(150,190,240,.42),inset 0 0 10px rgba(150,190,240,.20);
  outline:var(--ec-ow,1.6px) dashed rgba(150,196,255,.44);
  outline-offset:var(--ec-off,5px);
}
/* 已点亮：黄昏暖金，半径约 2.2 倍 */
.node.lit .dot{
  width:calc(16px * var(--sc,1));height:calc(16px * var(--sc,1));margin:calc(-8px * var(--sc,1)) 0 0 calc(-8px * var(--sc,1));
  background:radial-gradient(circle at 50% 42%, #fffaf0 0%, #ffdcae 46%, #ffb172 100%);
  box-shadow:0 0 10px rgba(255,206,152,.90), 0 0 20px rgba(255,152,84,.26);
}
/* 点亮星的细金环，让暖核与冷色星尘分层 */
.node.lit .dot::after{
  content:'';position:absolute;inset:calc(-4px * var(--sc,1));border-radius:50%;
  border:1px solid rgba(255,214,168,.32);
}
.node .halo{
  position:absolute;left:0;top:0;width:0;height:0;border-radius:50%;opacity:0;
  transition:opacity .8s ease,width .8s ease,height .8s ease,margin .8s ease;
  background:radial-gradient(circle, rgba(255,214,160,.62) 0%, rgba(255,150,74,.22) 34%, rgba(255,124,52,.05) 62%, rgba(255,124,52,0) 76%);
}
.node.lit .halo{opacity:.86;width:calc(54px * var(--sc,1) * var(--halo-k,1));height:calc(54px * var(--sc,1) * var(--halo-k,1));margin:calc(-27px * var(--sc,1) * var(--halo-k,1)) 0 0 calc(-27px * var(--sc,1) * var(--halo-k,1))}
.node.root.lit .halo{width:calc(196px * var(--sc,1) * var(--halo-k,1));height:calc(196px * var(--sc,1) * var(--halo-k,1));margin:calc(-98px * var(--sc,1) * var(--halo-k,1)) 0 0 calc(-98px * var(--sc,1) * var(--halo-k,1));animation:breathe 4.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.72);opacity:.68}50%{transform:scale(1.10);opacity:1}}
@keyframes flashpulse{0%{transform:scale(.45);opacity:1}70%{opacity:.95}100%{transform:scale(1.75);opacity:.7}}

.node .hint{
  position:absolute;left:0;top:calc(12px * var(--sc,1));transform:translateX(-50%);white-space:nowrap;pointer-events:none;
  /* 超长 label（最长 18 字）用省略号截断：屏幕宽度硬上限 --labw，绝不横向压住邻居 */
  max-width:var(--labw,240px);overflow:hidden;text-overflow:ellipsis;
  font-size:var(--hint,12px);letter-spacing:.06em;color:rgba(186,210,240,.78);
  text-shadow:0 1px 10px rgba(3,6,12,.95);
}
.node.lit .hint{color:rgba(255,222,182,.95);font-size:var(--lab,13px);letter-spacing:.04em}
.node.echo .hint{color:rgba(200,222,248,.78)}
/* ---------- 复盘揭晓（答案卷）：冷白实心 + 细虚线冷环，与暖金已点亮一眼可分 ---------- */
.node.review .dot{
  width:calc(11px * var(--sc,1));height:calc(11px * var(--sc,1));margin:calc(-5.5px * var(--sc,1)) 0 0 calc(-5.5px * var(--sc,1));
  background:radial-gradient(circle at 50% 45%, rgba(240,247,255,.96) 0%, rgba(178,206,247,.86) 55%, rgba(126,166,222,.62) 100%);
  box-shadow:0 0 10px rgba(150,190,245,.72),0 0 20px rgba(110,160,230,.30);
}
.node.review .dot::after{
  content:'';position:absolute;inset:calc(-5px * var(--sc,1));border-radius:50%;
  border:1px dashed rgba(168,204,255,.62);
}
.node.review .hint{color:rgba(205,226,252,.92);font-size:var(--lab,13px);letter-spacing:.03em}
.node.review.rv-echo .dot{
  width:var(--ec-sz,19px);height:var(--ec-sz,19px);
  margin:calc(var(--ec-sz,19px) / -2) 0 0 calc(var(--ec-sz,19px) / -2);
  background:rgba(134,162,206,.28);
  border:var(--ec-bw,2px) dashed rgba(192,218,255,.92);
  box-shadow:0 0 14px rgba(150,190,240,.36);
}
.node.review.rv-echo .dot::after{display:none}
.node.review.rv-echo .hint{color:rgba(190,214,248,.86)}
@media (hover:hover){.node.review:hover .dot{transform:scale(1.2);box-shadow:0 0 18px rgba(176,214,255,.95),0 0 30px rgba(120,176,246,.6)}}
/* 提示文字按碰撞逐节点裁剪（layoutHints）：放不下才隐藏这一个节点的提示，绝不全局一刀切 */
.node.nohint .hint{display:none}
/* 入场幽灵点：极暗、无文字、不可交互（只在 intro 活动期挂在 #nodes 里） */
#ghost-layer{position:absolute;left:0;top:0;width:0;height:0;opacity:0;pointer-events:none}
#ghost-layer .ghost-dot{position:absolute;left:0;top:0;width:var(--gz,3px);height:var(--gz,3px);margin:calc(var(--gz,3px) * -0.5) 0 0 calc(var(--gz,3px) * -0.5);border-radius:50%;background:#e6efff;box-shadow:0 0 calc(var(--gz,3px) * 1.4) rgba(170,200,255,.55)}
.node.hint-above .hint{top:auto;bottom:calc(14px * var(--sc,1))}
.node.hint-right .hint{top:50%;left:calc(11px * var(--sc,1));transform:translateY(-50%)}
.node.hint-left .hint{top:50%;right:calc(11px * var(--sc,1));left:auto;transform:translateY(-50%)}
#world.smooth{transition:transform .55s cubic-bezier(.22,.61,.36,1)}
/* boot 首帧与 ?flat=1 诊断模式：关闭过渡/动画，保证确定态渲染 */
#world.noanim,#world.noanim .node,#world.noanim .node .dot,#world.noanim .node .halo,#world.noanim .node .hint{transition:none!important;animation:none!important}
html.flat #world,html.flat #world *,html.flat #attrs,html.flat #toast,html.flat #panel,html.flat #panel *{transition:none!important;animation:none!important}
#world.dragging{transition:none}

.rippler{
  position:absolute;left:0;top:0;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;
  border:1.5px solid rgba(255,206,152,.92);pointer-events:none;animation:rip .95s ease-out forwards;
}
@keyframes rip{0%{transform:scale(.35);opacity:.95}100%{transform:scale(9);opacity:0}}

/* ---------- HUD ---------- */
#hud{
  position:fixed;left:18px;top:16px;z-index:30;display:flex;flex-direction:column;gap:9px;
  padding:13px 15px;border-radius:14px;background:var(--panel);border:1px solid var(--line);
  backdrop-filter:blur(7px);font-size:12px;letter-spacing:.03em;min-width:184px;
}
#hud .title{font-size:12.5px;letter-spacing:.12em;color:rgba(255,214,168,.9)}
#hud .title small{display:block;margin-top:3px;font-size:10.5px;letter-spacing:.06em;color:var(--dim)}
#hud .row{display:flex;justify-content:space-between;gap:16px;color:var(--dim)}
#hud .row b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
#diff{display:flex;gap:4px;margin-top:2px}
#diff button{
  flex:1;padding:5px 0;border-radius:8px;border:1px solid rgba(120,160,220,.20);background:rgba(255,255,255,.02);
  color:var(--dim);font-family:inherit;font-size:11px;cursor:pointer;transition:all .18s ease;
}
#diff button:hover{color:var(--ink);border-color:rgba(160,200,255,.36)}
#diff button.on{color:#0b0f18;background:linear-gradient(180deg,#ffe1b4,#ffb066);border-color:transparent;font-weight:600}
#hud .tools{display:flex;gap:6px;margin-top:3px;flex-wrap:wrap}
#hud .tools button{
  flex:1;padding:6px 0;border-radius:8px;border:1px solid rgba(120,160,220,.22);background:rgba(255,255,255,.03);
  color:var(--ink);font-family:inherit;font-size:11px;cursor:pointer;transition:all .18s ease;
}
#hud .tools button:hover{background:rgba(150,190,255,.12);border-color:rgba(160,200,255,.42)}
#jumpwrap{display:flex;align-items:center;gap:7px;color:var(--dim);cursor:pointer;font-size:11.5px;padding-top:2px}
#jumpwrap input{accent-color:#ffb066;width:13px;height:13px;cursor:pointer}
#jumpwrap.on{color:var(--warm)}

/* ---------- dock ---------- */
#dock{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:30;
  display:flex;flex-direction:column;align-items:center;gap:8px;width:min(560px,92vw);
}
#dockrow{display:flex;gap:8px;width:100%}
#guess{
  flex:1;padding:13px 18px;border-radius:999px;border:1px solid rgba(140,175,230,.26);
  background:rgba(9,14,24,.78);color:var(--ink);font-size:14px;font-family:inherit;outline:none;
  letter-spacing:.04em;transition:border-color .2s ease,box-shadow .2s ease;
}
#guess::placeholder{color:rgba(140,160,190,.55)}
#guess:focus{border-color:rgba(255,190,130,.6);box-shadow:0 0 0 3px rgba(255,150,60,.10)}
#guess.err{border-color:rgba(255,96,96,.8);box-shadow:0 0 0 3px rgba(255,80,80,.14)}
#guess.shake{animation:shk .32s ease}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
#send{
  padding:0 22px;border-radius:999px;border:1px solid rgba(255,190,130,.4);
  background:linear-gradient(180deg,rgba(255,214,160,.16),rgba(255,150,70,.10));
  color:var(--warm);font-family:inherit;font-size:13px;cursor:pointer;letter-spacing:.08em;transition:all .18s ease;
}
#send:hover{background:linear-gradient(180deg,rgba(255,214,160,.28),rgba(255,150,70,.18));color:#fff1dc}
#docknote{font-size:11px;color:rgba(130,152,184,.7);letter-spacing:.05em;height:14px}

/* 复盘横幅 */
#review-banner{
  position:fixed;left:50%;top:16px;transform:translate(-50%,-14px);z-index:33;
  display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;border-radius:11px;
  background:rgba(14,22,36,.92);border:1px solid rgba(140,190,255,.42);
  box-shadow:0 10px 34px rgba(0,0,0,.55),0 0 18px rgba(120,170,240,.16);
  font-size:12px;letter-spacing:.04em;color:rgba(214,232,255,.95);
  opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;
}
#review-banner.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
#review-banner .rb-dot{width:7px;height:7px;border-radius:50%;background:#8fc4ff;box-shadow:0 0 10px rgba(140,196,255,.95);flex:none}
#review-banner b{font-weight:500;color:#ffe0b6}
#review-banner button{
  padding:4px 9px;border-radius:7px;border:1px solid rgba(160,200,255,.4);background:rgba(255,255,255,.04);
  color:rgba(226,240,255,.95);font-family:inherit;font-size:11.5px;cursor:pointer;
}
#review-banner button:hover{background:rgba(150,190,255,.16);border-color:rgba(180,214,255,.6)}
body.review-on #dock{opacity:.45}
#toast{
  position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:40;pointer-events:none;
  padding:7px 16px;border-radius:999px;background:rgba(8,13,22,.86);border:1px solid rgba(140,175,230,.2);
  font-size:12px;letter-spacing:.05em;color:rgba(200,220,245,.9);opacity:0;transition:opacity .25s ease,transform .25s ease;
  white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
#toast.err{color:#ffb3b3;border-color:rgba(255,120,120,.35)}
#toast.ok{color:#ffd9a0;border-color:rgba(255,190,130,.35)}

/* ---------- attribute card（固定右上角：不遮 HUD 左上卡片与底部 dock） ---------- */
/* ---------- 右侧笔记面板：属性区 → 分隔线 → 笔记正文（可纵向滚动） ---------- */
#attrs{
  position:fixed;right:16px;top:16px;z-index:34;width:min(400px,36vw);max-height:calc(100vh - 32px);
  display:flex;flex-direction:column;gap:9px;padding:12px 14px 13px;border-radius:14px;
  background:rgba(10,16,26,.92);border:1px solid rgba(130,170,230,.26);
  backdrop-filter:blur(8px);box-shadow:0 18px 48px rgba(0,0,0,.55);
  opacity:0;pointer-events:none;transform:translateX(26px);overflow-y:auto;overscroll-behavior:contain;
  transition:opacity .22s ease,transform .26s cubic-bezier(.2,.8,.2,1);
}
#attrs.on{opacity:1;pointer-events:auto;transform:none}
/* 正文：属性区下面那段（极简 Markdown 渲染结果） */
#attrs .asep{flex:none;height:1px;background:linear-gradient(90deg,rgba(120,160,220,.02),rgba(140,180,240,.30),rgba(120,160,220,.02));margin:2px 0 1px}
#attrs .abody{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:7px;
  font-size:12px;line-height:1.62;color:rgba(226,238,252,.9);word-break:break-word}
#attrs .abody h4{margin:2px 0 0;font-size:12.5px;font-weight:600;color:rgba(255,222,182,.96);letter-spacing:.04em}
#attrs .abody h5{margin:1px 0 0;font-size:12px;font-weight:600;color:rgba(238,226,200,.9)}
#attrs .abody p.bp{margin:0}
#attrs .abody ul,#attrs .abody ol{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:2px}
#attrs .abody li{color:rgba(222,236,252,.9)}
#attrs .abody b{color:#fff4e2}
#attrs .abody code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;padding:0 4px;border-radius:4px;
  background:rgba(140,180,240,.14);color:rgba(214,232,255,.98)}
#attrs .bempty{color:rgba(150,172,200,.72);font-size:11.5px;letter-spacing:.04em}
/* 双链 chip：可点=冷青；对不上/未点亮=灰；纯文本=无底 */
#attrs .wl{border-radius:5px;padding:0 3px;white-space:nowrap}
#attrs .wl-on{color:#8fe0ff;background:rgba(127,214,255,.12);border-bottom:1px solid rgba(127,214,255,.45);cursor:pointer}
#attrs .wl-on:hover{background:rgba(127,214,255,.22);color:#c8f2ff}
#attrs .wl-locked{color:rgba(150,170,196,.7);background:rgba(140,180,240,.06);cursor:not-allowed;border-bottom:1px dashed rgba(140,170,210,.4)}
#attrs .wl-plain{color:rgba(196,212,234,.82)}
/* 未点亮目标的遮罩块：固定 3.4em 宽，不随名字字数变化（否则泄露字数），DOM 里没有任何文字 */
#attrs .wl-mask{
  display:inline-block;width:3.4em;height:1em;border-radius:3px;vertical-align:-1px;
  background:linear-gradient(100deg,rgba(126,158,200,.30),rgba(126,158,200,.14));
  box-shadow:inset 0 0 0 1px rgba(150,190,240,.14);cursor:not-allowed;border-bottom:0;color:transparent;overflow:hidden;
}
/* 关系区：直接子节点 / 关联 */
#attrs .arel{display:flex;flex-direction:column;gap:3px;margin:0 0 9px}
#attrs .arel:empty{display:none}
#attrs .arl{font-size:10px;letter-spacing:.16em;color:var(--dim);margin:3px 0 1px}
#attrs .arr{display:flex;align-items:center;gap:7px;font-size:11.5px;line-height:15px;color:rgba(214,232,252,.9);min-height:15px}
#attrs .ard{flex:none;width:6px;height:6px;border-radius:50%;background:rgba(226,240,255,.5);box-shadow:0 0 6px rgba(160,200,250,.5)}
#attrs .ard.lit{width:8px;height:8px;background:radial-gradient(circle at 50% 42%,#fffaf0 0%,#ffb172 100%);box-shadow:0 0 8px rgba(255,206,152,.85)}
#attrs .ard.echo{background:transparent;border:1px dashed rgba(200,224,255,.9);box-shadow:none}
#attrs .ard.hidden{background:rgba(150,175,210,.28);box-shadow:none}
#attrs .arrlink{cursor:pointer;color:#8fe0ff;border-bottom:1px solid rgba(127,214,255,.35)}
#attrs .arrlink:hover{color:#c8f2ff;background:rgba(127,214,255,.12)}
#attrs .ah{display:flex;align-items:baseline;gap:7px}
#attrs .ak-title{font-size:10.5px;letter-spacing:.18em;color:var(--dim)}
#attrs #attrs-title{
  flex:1;min-width:0;font-size:12.5px;font-weight:500;color:rgba(255,214,168,.95);letter-spacing:.04em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#attrs #attrs-close{
  flex:none;width:20px;height:20px;line-height:17px;text-align:center;border-radius:6px;cursor:pointer;
  border:1px solid rgba(120,160,220,.22);background:rgba(255,255,255,.03);color:var(--dim);
  font-family:inherit;font-size:13px;transition:all .16s ease;
}
#attrs #attrs-close:hover{color:var(--ink);border-color:rgba(160,200,255,.44);background:rgba(150,190,255,.14)}
#attrs .ab{display:flex;flex-direction:column;gap:6px}
#attrs .ar{display:flex;gap:9px;align-items:flex-start;font-size:12px;line-height:1.5}
#attrs .ak{flex:none;width:56px;color:var(--dim);font-size:11px;letter-spacing:.06em;padding-top:1px}
#attrs .av{flex:1;min-width:0;color:rgba(236,245,255,.98);word-break:break-word}
#attrs .av.empty{color:rgba(140,160,186,.62)}
#attrs .af{font-size:10.5px;color:var(--dim);letter-spacing:.03em;border-top:1px solid rgba(120,160,220,.14);padding-top:7px}
#attrs.blank .af{color:rgba(150,170,196,.7)}

/* ---------- settlement panel ---------- */
#panel{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:rgba(3,6,12,.74);backdrop-filter:blur(3px)}
#panel.open{display:grid}
#panel .card{
  width:min(780px,94vw);max-height:86vh;display:flex;flex-direction:column;gap:14px;
  padding:20px 22px;border-radius:18px;border:1px solid rgba(130,170,230,.22);
  background:linear-gradient(180deg,#0e1624,#080c14);box-shadow:0 24px 70px rgba(0,0,0,.6);
}
#panel h2{margin:0;font-size:15px;letter-spacing:.16em;color:rgba(255,214,168,.95);font-weight:500}
#panel h2 small{float:right;font-size:11px;letter-spacing:.04em;color:var(--dim);font-weight:400}
#stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
#stats div{padding:9px 11px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid rgba(120,160,220,.14)}
#stats span{display:block;font-size:10.5px;color:var(--dim);letter-spacing:.08em;margin-bottom:4px}
#stats b{font-size:16px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--ink)}
#listwrap{overflow:auto;flex:1;min-height:120px;border-radius:10px;border:1px solid rgba(120,160,220,.14)}
#list{width:100%;border-collapse:collapse;font-size:12px}
#list th{position:sticky;top:0;background:#0d1521;color:var(--dim);font-weight:400;text-align:left;padding:8px 10px;font-size:10.5px;letter-spacing:.1em;border-bottom:1px solid rgba(120,160,220,.16)}
#list td{padding:7px 10px;border-bottom:1px solid rgba(120,160,220,.07);color:rgba(215,228,245,.9)}
#list td.num{color:var(--dim);font-variant-numeric:tabular-nums;width:52px}
#list td.tag{width:74px;color:var(--warm2);font-size:11px}
#list td.tm{width:86px;color:var(--dim);font-variant-numeric:tabular-nums}
#panel .actions{display:flex;gap:8px;justify-content:flex-end}
#panel .actions button{
  padding:8px 16px;border-radius:9px;border:1px solid rgba(120,160,220,.24);background:rgba(255,255,255,.03);
  color:var(--ink);font-family:inherit;font-size:12px;cursor:pointer;transition:all .18s ease;letter-spacing:.05em;
}
#panel .actions button:hover{background:rgba(150,190,255,.14);border-color:rgba(160,200,255,.44)}
#panel .actions button.primary{background:linear-gradient(180deg,rgba(255,214,160,.2),rgba(255,150,70,.12));border-color:rgba(255,190,130,.42);color:var(--warm)}

}
#selftest-report.show{display:block}
#intro-report{left:auto;right:12px;border-color:rgba(255,214,160,.3);color:#ffe0b0}
#intro-report.show{display:block}
  /* V-spec：自定义跳层开关（自绘滑块，非原生 checkbox） */
  #jumpwrap{display:flex;align-items:center;gap:9px;font-size:12.5px;color:#9fb3cd;cursor:pointer;margin-top:4px}
  #jumpwrap input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
  #jumpwrap .sw-track{
    position:relative;flex:none;width:36px;height:19px;border-radius:10px;
    background:rgba(120,146,180,.16);border:1px solid rgba(140,170,210,.34);transition:all .25s ease;
  }
  #jumpwrap .sw-track:after{
    content:'';position:absolute;left:2px;top:2px;width:13px;height:13px;border-radius:50%;
    background:#8195ae;transition:all .25s ease;
  }
  #jumpwrap input:checked + .sw-track{background:rgba(255,168,90,.26);border-color:rgba(255,196,132,.8)}
  #jumpwrap input:checked + .sw-track:after{left:19px;background:linear-gradient(180deg,#ffe9c8,#ff9a4d);box-shadow:0 0 10px rgba(255,170,90,.95)}
  #jumpwrap.on .sw-text{color:#ffd9a0}
  /* C1③：已点亮星再次被猜中时，其子代提亮一档 */
  .node.mapped.boost .dot { width: 12px; height: 12px; background: #9db4d8; box-shadow: 0 0 12px rgba(150,180,225,.6); }

:{"theory":[],"psychologist":[],"experiment":[]},"body":"注意，是**心理活动指向和聚焦于特定的对象或事物，同时忽略其他事物的心理现象**\n从信息加工的角度看，注意是**个体主动地选择和处理环境中的特定信息，忽略和抑制其他无关信息的过程**\n注意是意识中最鲜明、清晰的一种状态。它*不是独立的心理过程*，而是一种带有认知性的心理倾向，是高级心理活动产生的条件，作为整个心理活动的引导者和组织者"},{"id":"注意的性质","label":"注意的性质","level":2,"chars":5,"keywords":["注意的性质","指向与集中","注意的两个特点"],"parent":"注意的概述","group":"注意的概述","related":[],"summary":"子卡片：意识的指向性、意识的集中性","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"1. ![[意识的指向性]]\n\n2. ![[意识的集中性]]"},{"id":"注意的功能","label":"注意的功能","level":2,"chars":5,"keywords":["注意的功能","选择功能","维持功能","整合功能"],"parent":"注意的概述","group":"注意的概述","related":[],"summary":"注意的功能：选择、维持、整合（调节与监督）","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"注意的功能\n1. ![[注意的选择功能]]\n2. ![[注意的维持功能]]\n3. ![[注意的整合功能（调节和监督）]]"},{"id":"注意的品质","label":"注意的品质","level":2,"chars":5,"keywords":["注意的品质","四种品质","注意品质"],"parent":"注意的概述","group":"注意的概述","related":[],"summary":"注意的品质包括注意广度、注意转移、注意稳定、注意分配","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"1. [[注意品质-注意广度]]\n2. [[注意品质-注意转移]]\n3. [[注意品质-注意稳定]]\n4. [[注意品质-注意分配]]"},{"id":"朝向反射","label":"朝向反射","level":2,"chars":4,"keywords":["朝向反射","情境新异性","最初级的生理机制"],"parent":"注意的生理机制","group":"注意的生理机制","related":[],"summary":"由 情境新异性 引起的一种复杂、特殊的反射，为 人和动物共有 ，是 注意最初级的生理机制","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"由**情境新异性**引起的一种复杂、特殊的反射，为**人和动物共有**，是**注意最初级的生理机制。**\n\n朝向反射出现时身体的一系列变化有助于提高感受性、动员能量资源。刺激一旦失去新异性，或个体习惯了刺激，朝向反射就不会发生。"},{"id":"脑干网状结构","label":"脑干网状结构","level":2,"chars":6,"keywords":["脑干网状结构","维持觉醒","广泛投射到大脑皮层"],"parent":"注意的生理机制","group":"注意的生理机制","related":[],"summary":"主要于 觉醒 有关","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"主要于**觉醒**有关\n\n**脑干网状结构** 属于：**[[非特异投射系统]]**\n\n它的作用是：\n\n- 接受感觉通路的侧支输入；\n- 广泛投射到大脑皮层；\n- 不传递具体信息，而是**提高大脑皮层的兴奋性，维持觉醒和注意状态**。"},{"id":"边缘系统","label":"边缘系统","level":2,"chars":4,"keywords":["边缘系统","注意神经元","新异刺激"],"parent":"注意的生理机制","group":"注意的生理机制","related":[],"summary":"存在大量的“ 注意神经元 ”， 仅 对 ：\n1. ![[前注意阶段（特征登记）]]；\n2. ![[特征结合阶段（特征整合)]]\n\n也就是说，个体对特征和客体的加工是在知觉的**不同阶段**实现的。"},{"id":"阈下知觉","label":"阈下知觉","level":3,"chars":4,"keywords":["阈下知觉","阈下刺激","意识不到刺激"],"parent":"无意识","group":"意识的分类","related":[],"summary":"个体 意识不到环境刺激的存在或特性 ， 但刺激能够引起或改变其行为或生理反应 的一个心理现象","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"个体**意识不到环境刺激的存在或特性**，**但刺激能够引起或改变其行为或生理反应**的一个心理现象"},{"id":"盲视","label":"盲视","level":3,"chars":2,"keywords":["盲视","脑损伤","盲视野"],"parent":"无意识","group":"意识的分类","related":[],"summary":"脑损伤 引起的对刺激的无意识知觉，患者不能有意识的觉察视觉刺激， 但仍能指出呈现在盲视野中的刺激","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"**脑损伤**引起的对刺激的无意识知觉，患者不能有意识的觉察视觉刺激，**但仍能指出呈现在盲视野中的刺激**，这表明人们对视觉信息的辨认并不一定依赖对视觉刺激的有意识觉知，同时也证明了无意识现象的存在，盲视的产生机制**可能是视觉皮层损伤后，视皮层下的通路还可以进行一定形式的视觉分析**"},{"id":"视盲","label":"视盲","level":3,"chars":2,"keywords":["视盲","视盲的两类现象","非注意视盲与变化盲"],"parent":"无意识","group":"意识的分类","related":[],"summary":"子卡片：非注意视盲、变化盲","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"- ![[非注意视盲]]\n- ![[变化盲]]"},{"id":"无意识行为","label":"无意识行为","level":3,"chars":5,"keywords":["无意识行为","熟练自动完成","骑自行车"],"parent":"无意识","group":"意识的分类","related":["自动化加工（前注意加工）"],"summary":"人的一些 自动化的行为 、 不受意识控制 的行为，如熟练者骑自行车","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"人的一些**自动化的行为**、**不受意识控制**的行为，如熟练者骑自行车\n![[自动化加工（前注意加工）]]"},{"id":"睡眠","label":"睡眠","level":3,"chars":2,"keywords":["睡眠","睡眠状态","睡眠周期"],"parent":"意识状态","group":"意识的分类","related":[],"summary":"子卡片：睡眠的阶段、睡眠的功能、失眠-失眠症、大脑处于睡眠时的脑波","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"##### ![[睡眠的阶段]]\n##### ![[睡眠的功能]]\n##### ![[失眠-失眠症]]"},{"id":"催眠","label":"催眠","level":3,"chars":2,"keywords":["催眠","人为诱导","暗示性增长"],"parent":"意识状态","group":"意识的分类","related":[],"summary":"是 人为诱导 产生的 注意范围缩小 、 暗示性增长 的 特殊意识状态 （脑电波与 清醒 状态一致）","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"## 含义\n催眠是**人为诱导**产生的**注意范围缩小**、**暗示性增长**的*特殊意识状态*（脑电波与**清醒**状态一致）\n\n## ![[催眠状态下的心理特征]]\n## ![[容易被催眠者的特征]]\n\n## ![[催眠的相关理论]]" 集中性是心理活动或意识在一定方向上活动的 强度或紧张度 ，强度越大紧张度越高注意也就越集中","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"集中性是心理活动或意识在一定方向上活动的**强度或紧张度**，强度越大紧张度越高注意也就越集中"},{"id":"注意的选择功能","label":"注意的选择功能","level":3,"chars":7,"keywords":["注意的选择功能","选择特定刺激","避开无关刺激"],"parent":"注意的功能","group":"注意的概述","related":[],"summary":"使人们在某一瞬间选择具有意义的、符合当前活动需要的特定刺激，同时避开或抑制无关刺激","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"使人们在某一瞬间选择具有意义的、符合当前活动需要的特定刺激，同时避开或抑制无关刺激"},{"id":"注意的维持功能","label":"注意的维持功能","level":3,"chars":7,"keywords":["注意的维持功能","保持特定对象","一定时间内"],"parent":"注意的功能","group":"注意的概述","related":[],"summary":"使心理活动在一定时间内保持在特定对象上","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"使心理活动在一定时间内保持在特定对象上"},{"id":"注意的整合功能（调节和监督）","label":"注意的整合功能（调节和监督）","level":3,"chars":14,"keywords":["注意的整合功能（调节和监督）","精细加工","整合为完整物体","调节和监督"],"parent":"注意的功能","group":"注意的概述","related":[],"summary":"在注意状态下，人能对个别特征的信息进行精细加工并将其整合为一个完整的物体","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"在注意状态下，人能对个别特征的信息进行精细加工并将其整合为一个完整的物体"},{"id":"注意品质-注意广度","label":"注意品质-注意广度","level":3,"chars":9,"keywords":["注意品质-注意广度","注意广度","范围"],"parent":"注意的品质","group":"注意的概述","related":["选择性注意（指向）一双耳分听"],"summary":"子卡片：成人注意的平均广度、影响注意广度的因素有","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"![[成人注意的平均广度]]\n\n![[影响注意广度的因素有]]"},{"id":"注意品质-注意转移","label":"注意品质-注意转移","level":3,"chars":9,"keywords":["注意品质-注意转移","注意转移","主动更换对象"],"parent":"注意的品质","group":"注意的概述","related":["选择性注意（指向）一双耳分听"],"summary":"注意的品质 下的子节点：注意转移（该笔记只有标题）","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"注意品质-注意转移\n\n（有待丰富）"},{"id":"注意品质-注意稳定","label":"注意品质-注意稳定","level":3,"chars":9,"keywords":["注意品质-注意稳定","注意稳定","保持时间"],"parent":"注意的品质","group":"注意的概述","related":["持续性注意（集中）一警戒作业"],"summary":"子卡片：注意分散、注意起伏（注意的动摇）","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"- ![[注意分散]]\n\n- ![[注意起伏（注意的动摇）]]"},{"id":"注意品质-注意分配","label":"注意品质-注意分配","level":3,"chars":9,"keywords":["注意品质-注意分配","注意分配","同时进行两种活动"],"parent":"注意的品质","group":"注意的概述","related":["分配性注意（指向+集中）一双作业操作"],"summary":"注意的品质 下的子节点：注意分配（该笔记只有标题）","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"注意品质-注意分配\n\n（有待丰富）"},{"id":"前扣带回（ACC)","label":"前扣带回（ACC)","level":3,"chars":9,"keywords":["前扣带回（ACC)","ACC","冲突监测"],"parent":"边缘系统","group":"注意的生理机制","related":[],"summary":"前扣带回广泛参与各种注意认知活动 前扣带回（ACC) 是 冲突监测 的核心脑区","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"前扣带回广泛参与各种注意认知活动\n**前扣带回（ACC)** 是**冲突监测**的核心脑区。它的主要功能就是检测认知过程中出现的**冲突、错误**，同时参与**调节**注意力和行为**选择**，*在需要克服干扰、完成冲突性认知任务时会被显著激活。*"},{"id":"不随意注意（外源性注意）","label":"不随意注意（外源性注意）","level":3,"chars":12,"keywords":["不随意注意（外源性注意）","外源性注意","不需要意志努力"],"parent":"注意的分类-线索来源","group":"注意的分类","related":[],"summary":"不随意注意 是指事先没有目的，也 不需要意志努力 就能维持的注意","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"**不随意注意**是指事先没有目的，也**不需要意志努力**就能维持的注意。不随意注意的作用具有两重性，\n- 一方面可以**帮助**人对**新异事物定向**（积极作用)，\n- 另一方面可能会**干扰**正在进行的活动。\n\n![[影响非随意注意的因素]]"},{"id":"随意注意（内源性注意）","label":"随意注意（内源性注意）","level":3,"chars":11,"keywords":["随意注意（内源性注意）","内源性注意","有目的"],"parent":"注意的分类-线索来源","group":"注意的分类","related":[],"summary":"注意的分类-线索来源 下的子节点：有意注意（该笔记只有标题）","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"随意注意（内源性注意）\n\n（有待丰富）"},{"id":"随意后注意（有意后注意）","label":"随意后注意（有意后注意）","level":3,"chars":12,"keywords":["随意后注意（有意后注意）","有意后注意","无需意志努力"],"parent":"注意的分类-线索来源","group":"注意的分类","related":[],"summary":"注意的分类-线索来源 下的子节点：有意后注意（该笔记只有标题）","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"随意后注意（有意后注意）\n\n（有待丰富）"},{"id":"选择性注意（指向）一双耳分听","label":"选择性注意（指向）一双耳分听","level":3,"chars":14,"keywords":["选择性注意（指向）一双耳分听","双耳分听","指向性"],"parent":"注意的分类-功能","group":"注意的分类","related":["注意品质-注意广度","注意品质-注意转移"],"summary":"子卡片：注意品质-注意广度、注意品质-注意转移","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"1. [[注意品质-注意广度]]\n2. [[注意品质-注意转移]]"},{"id":"持续性注意（集中）一警戒作业","label":"持续性注意（集中）一警戒作业","level":3,"chars":14,"keywords":["持续性注意（集中）一警戒作业","警戒作业","持续性"],"parent":"注意的分类-功能","group":"注意的分类","related":["注意品质-注意稳定"],"summary":"子卡片：注意品质-注意稳定","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"1. [[注意品质-注意稳定]]"},{"id":"分配性注意（指向+集中）一双作业操作","label":"分配性注意（指向+集中）一双作业操作","level":3,"chars":18,"keywords":["分配性注意（指向+集中）一双作业操作","双作业操作","分配性"],"parent":"注意的分类-功能","group":"注意的分类","related":["后期选择理论-多伊奇","注意品质-注意分配"],"summary":"子卡片：注意品质-注意分配","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"1. [[注意品质-注意分配]]"},{"id":"过滤器理论-布罗德本特","label":"过滤器理论-布罗德本特","level":3,"chars":11,"keywords":["过滤器理论-布罗德本特","布罗德本特","全或无","通道容量","过滤器理论","早期选择模型","单通道理论","瓶颈理论","双耳分听","布洛德本特"],"parent":"注意的选择理论（多对一)","group":"注意的相关理论","related":["广义和狭义的早期选择理论"],"summary":"过滤器理论（早期选择模型 / 单通道理论 / 瓶颈理论） 提出者： 布罗德本特","attrs":{"theory":["过滤器理论","早期选择模型","单通道理论","瓶颈理论"],"psychologist":["布罗德本特"],"experiment":["双耳分听"]},"body":"过滤器理论（早期选择模型 / 单通道理论 / 瓶颈理论）\n提出者：**布罗德本特**\n\n核心思想：\n信息加工受**通道容量**限制，外界信息先**经过选择性过滤器**，只有**被选择的信息**才能进入高级分析阶段\n\n理论观点：\n**双耳分听**实验支持该理论。过滤器按照**全或无**原则工作，即**完全通过或完全阻断**，选择依据是刺激的**物理**属性\n\n评价：\n该理论无法解释![[鸡尾酒会效应]]"},{"id":"衰减理论-特瑞斯曼","label":"衰减理论-特瑞斯曼","level":3,"chars":9,"keywords":["衰减理论-特瑞斯曼","特瑞斯曼","衰减器","被衰减","衰减理论","特雷斯曼"],"parent":"注意的选择理论（多对一)","group":"注意的相关理论","related":["广义和狭义的早期选择理论","鸡尾酒会效应"],"summary":"提出者： 特雷斯曼","attrs":{"theory":["衰减理论"],"psychologist":["特雷斯曼"],"experiment":[]},"body":"提出者：**特雷斯曼**\n\n核心思想：\n非注意信息不是被完全阻断，而是**被衰减（减弱）**，但**特别有意义的信息（如自己的名字）仍可突破衰减器被识别**\n\n理论观点：\n特雷斯曼修正了过滤器理论，认为过滤器不是全或无的开关，而是衰减器。**不同刺激有不同激活阈值，意义重要的信息阈值低，容易被激活**\n\n评价：\n能较好解释[[鸡尾酒会效应]]，兼顾了早期选择模型和现实中的注意现象"},{"id":"后期选择理论-多伊奇","label":"后期选择理论-多伊奇","level":3,"chars":10,"keywords":["后期选择理论-多伊奇","多伊奇","知觉分析","选择性输出"],"parent":"注意的选择理论（多对一)","group":"注意的相关理论","related":["分配性注意（指向+集中）一双作业操作","鸡尾酒会效应"],"summary":"提出者：多伊奇夫妇、诺曼","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"提出者：多伊奇夫妇、诺曼\n\n核心思想：\n所有信息都**得到了充分加工**，信息选择的位置发生在**知觉分析**之后、**做出反应**的阶段\n该机制称为\"\"相关性\"\"——即**对相关刺激做出反应**。某些信息得到进一步加工后被**选择性输出**\n\n评价：\n能很好解释[[Stroop效应]]和[[分配性注意（指向+集中）一双作业操作]]现象，也能解释有**意义信息**容易引起注意([[鸡尾酒会效应]])。但无法解释**早期选择现象**\n\n![[广义和狭义的早期选择理论]]"},{"id":"多阶段选择模型-约翰斯顿","label":"多阶段选择模型-约翰斯顿","level":3,"chars":12,"keywords":["多阶段选择模型-约翰斯顿","约翰斯顿","不同加工阶段","多阶段选择模型","海因兹"],"parent":"注意的选择理论（多对一)","group":"注意的相关理论","related":[],"summary":"约翰斯顿和海因兹","attrs":{"theory":["多阶段选择模型"],"psychologist":["约翰斯顿","海因兹"],"experiment":[]},"body":"约翰斯顿和海因兹\n\n核心思想：\n注意的选择过程可发生在不同加工阶段，个体可以主动地控制早期或晚期选择信息\n\n理论观点：\n注意的选择不是固定在某一阶段，而是根据任务需求灵活调整，更好地满足当前任务或情境的需要\n\n评价：\n该理论使注意的选择过程变得很有弹性，避免了过于绝对化的假设带来的难题"},{"id":"认知资源理论","label":"认知资源理论","level":3,"chars":6,"keywords":["认知资源理论","中枢能量分配理论","卡尼曼","资源限制模型"],"parent":"注意的分配理论（一对多）","group":"注意的相关理论","related":[],"summary":"认知资源理论（中枢能量分配理论 / 资源限制模型） 提出者：卡尼曼","attrs":{"theory":["认知资源理论","中枢能量分配理论","资源限制模型"],"psychologist":["卡尼曼"],"experiment":[]},"body":"认知资源理论（中枢能量分配理论 / 资源限制模型）\n提出者：卡尼曼\n\n核心思想：\n把注意看成对刺激进行归类和识别的认知资源（中枢能量），不同的认知任务对认知资源的需求不同\n\n理论观点：\n- 认知是有限资源(内在资源)\n- 刺激加工要占用资源(外在刺激)\n刺激越复杂占用的资源越多。资源总量有限，受唤醒水平调节。资源耗尽时新刺激无法加工。\n\n注意的认知资源理论认为注意资源是有限的，**注意资源是由唤醒水平决定的**，*输入刺激本身不占用认知资源*，人可以灵活地支配注意资源的分配。。\n【小Tips】\n**输入刺激是否占用认知资源以及占用多少，取决于个体对刺激的重视程度、任务的要求等**，并非自动占用。比如，某天你就是不想学习，死活不想学习。就算别人把书本摊开摆在你面前你也学不进去，因此输入刺激不会自动占用你的认知资源。\n\n![[认知过程类型-卡尼曼]]\n\n![[分配认知资源理论的影响因素]]\n\n评价：\n对解释注意力、工作记忆等认知现象具有重要意义，帮助理解认知过程中的限制和优化方式"},{"id":"前注意阶段（特征登记）","label":"前注意阶段（特征登记）","level":3,"chars":11,"keywords":["前注意阶段（特征登记）","平行加工","特征登记"],"parent":"特征整合理论","group":"注意的相关理论","related":[],"summary":"前注意阶段，个体对特征进行 自动的平行加工 ，无须注意参与","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"前注意阶段，个体对特征进行**自动的平行加工**，无须注意参与"},{"id":"特征结合阶段（特征整合)","label":"特征结合阶段（特征整合)","level":3,"chars":12,"keywords":["特征结合阶段（特征整合)","系列加工","集中注意"],"parent":"特征整合理论","group":"注意的相关理论","related":[],"summary":"结合阶段，需要集中注意将众多特征结合为客体，其加工方式是系列加工","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"结合阶段，需要集中注意将众多特征结合为客体，其加工方式是系列加工。"},{"id":"非注意视盲","label":"非注意视盲","level":4,"chars":5,"keywords":["非注意视盲","注意力分散","未被意识到"],"parent":"视盲","group":"意识的分类","related":[],"summary":"注意力分散 或 注意被其他活动所占用时 ，一些 本来能够意识到 或显而易见的刺激或事物 却没有被意识到 的现象","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"**注意力分散**或**注意被其他活动所占用时**，一些**本来能够意识到**或显而易见的刺激或事物**却没有被意识到**的现象"},{"id":"变化盲","label":"变化盲","level":4,"chars":3,"keywords":["变化盲","西蒙斯","表征不够全面"],"parent":"视盲","group":"意识的分类","related":[],"summary":"难以察觉事物或情景所发生 变化 的现象， 西蒙斯 认为这可能是因为 个体对刺激的表征不够全面","attrs":{"theory":[],"psychologist":["西蒙斯"],"experiment":[]},"body":"难以察觉事物或情景所发生**变化**的现象，**西蒙斯**认为这可能是因为**个体对刺激的表征不够全面**，不能对前后呈现的刺激的全部视觉表征进行有效的比较"},{"id":"睡眠的阶段","label":"睡眠的阶段","level":4,"chars":5,"keywords":["睡眠的阶段","NREM","REM"],"parent":"睡眠","group":"意识的分类","related":[],"summary":"在睡眠过程中， NREM 睡眠和 REM 睡眠会交替进行，大约每晚重复 4～6 次","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"在睡眠过程中，**NREM** 睡眠和 **REM** 睡眠会交替进行，大约每晚重复 **4～6** 次，正常的睡眠是由**慢波睡眠**到**快波睡眠**再到慢波睡眠不断交替进行的\n# ![[NREM睡眠]]\n\n# ![[快速眼动阶段-REM]]"},{"id":"睡眠的功能","label":"睡眠的功能","level":4,"chars":5,"keywords":["睡眠的功能","功能恢复","自我保护","巩固记忆"],"parent":"睡眠","group":"意识的分类","related":[],"summary":"生理 ：功能恢复；自我保护；促进身体发育；维护机体的免疫功能，改善心情等 认知 ：巩固和重建记忆；激发灵感和创造性思维","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"**生理**：功能恢复；自我保护；促进身体发育；维护机体的免疫功能，改善心情等\n**认知**：巩固和重建记忆；激发灵感和创造性思维"},{"id":"失眠-失眠症","label":"失眠-失眠症","level":4,"chars":6,"keywords":["失眠-失眠症","入睡困难","精神失调"],"parent":"睡眠","group":"意识的分类","related":[],"summary":"指 入睡困难、睡眠不好的现象 ，通常会伴随 精神失调 （如焦虑、精神抑郁等），对个体的生理功能及日常生活有一定影响","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"指**入睡困难、睡眠不好的现象**，通常会伴随**精神失调**（如焦虑、精神抑郁等），对个体的生理功能及日常生活有一定影响。\n常出现**α波**\n失眠随着年龄的增长有增加的趋势，通常在女性中更为常见\n\n![[失眠的原因]]\n\n![[应对失眠的办法]]"},{"id":"大脑处于睡眠时的脑波","label":"大脑处于睡眠时的脑波","level":4,"chars":10,"keywords":["大脑处于睡眠时的脑波","δ波","更加低频高幅"],"parent":"睡眠","group":"意识的分类","related":[],"summary":"当大脑处于睡眠状态时，脑电以δ（Δ）波为主（更加低频高幅）","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"当大脑处于((::::睡眠))状态时，脑电以((::::δ（Δ）))波为主（更加低频高幅）"},{"id":"催眠状态下 :"意识的分类","related":[],"summary":"生理方面 ：缓解慢性疼痛、提升免疫力等 心理方面 ：降低抑郁复发率、缓解焦虑、提升幸福感、促进注意/记忆/学习等","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"**生理方面**：缓解慢性疼痛、提升免疫力等\n**心理方面**：降低抑郁复发率、缓解焦虑、提升幸福感、促进注意/记忆/学习等"},{"id":"成人注意的平均广度","label":"成人注意的平均广度","level":4,"chars":9,"keywords":["成人注意的平均广度","外文字母4个","黑色圆点8个","汉字3个"],"parent":"注意品质-注意广度","group":"注意的概述","related":[],"summary":"心理学实验表明，成人注意的平均广度是： - 外文字母4-6个， - 黑色圆点8-9个，几何图形3-4个","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"心理学实验表明，成人注意的平均广度是：\n\t\t- 外文字母4-6个，\n\t\t- 黑色圆点8-9个，几何图形3-4个，\n\t\t- 汉字3-4个。"},{"id":"影响注意广度的因素有","label":"影响注意广度的因素有","level":4,"chars":10,"keywords":["影响注意广度的因素有","知觉对象的特点","活动任务","知识经验"],"parent":"注意品质-注意广度","group":"注意的概述","related":[],"summary":"1. 知觉对象的特点 2. 活动任务 3. 知识经验","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"1. 知觉对象的特点\n2. 活动任务\n3. 知识经验，"},{"id":"注意分散","label":"注意分散","level":4,"chars":4,"keywords":["注意分散","消极分心","分散品质"],"parent":"注意品质-注意稳定","group":"注意的概述","related":[],"summary":"注意分散影响注意品质，是消极分心","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"**注意分散**\n注意分散影响注意品质，是消极分心。"},{"id":"注意起伏（注意的动摇）","label":"注意起伏（注意的动摇）","level":4,"chars":11,"keywords":["注意起伏（注意的动摇）","注意的动摇","客观生理现象"],"parent":"注意品质-注意稳定","group":"注意的概述","related":[],"summary":"「注意稳定性」这一品质下的一种 客观生理现象 ， 不属于独立的注意品质 。注意起伏通常不算品质变差，是正常波动","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"「注意稳定性」这一品质下的一种**客观生理现象**，*不属于独立的注意品质*。注意起伏通常不算品质变差，是正常波动。"},{"id":"影响非随意注意的因素","label":"影响非随意注意的因素","level":4,"chars":10,"keywords":["影响非随意注意的因素","刺激物自身特点","人本身所处的状态"],"parent":"不随意注意（外源性注意）","group":"注意的分类","related":[],"summary":"1. 刺激物自身特点（刺激物的新颖性、刺激物的强度、 运动变化 )","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"1. 刺激物自身特点（刺激物的新颖性、刺激物的强度、**运动变化**)、\n\n2. 人本身所处的状态(主体的需要、兴趣、情绪情感、个人的期待、人格特征等)。"},{"id":"鸡尾酒会效应","label":"鸡尾酒会效应","level":4,"chars":6,"keywords":["鸡尾酒会效应","自己的名字","意义重要的信息"],"parent":"过滤器理论-布罗德本特","group":"注意的相关理论","related":["后期选择理论-多伊奇","衰减理论-特瑞斯曼"],"summary":"未被注意 的信息中， 意义重要 的信息（如自己的名字）仍能被察觉","attrs":{"theory":[],"psychologist":[],"experiment":["鸡尾酒会效应"]},"body":"**未被注意**的信息中，**意义重要**的信息（如自己的名字）仍能被察觉"},{"id":"广义和狭义的早期选择理论","label":"广义和狭义的早期选择理论","level":4,"chars":12,"keywords":["广义和狭义的早期选择理论","广义早期选择","狭义指过滤器理论"],"parent":"后期选择理论-多伊奇","group":"注意的相关理论","related":["衰减理论-特瑞斯曼","过滤器理论-布罗德本特"],"summary":"狭义专指过滤器理论；广义早期选择理论还包括衰减理论","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"- 广义上的早期选择理论包括[[过滤器理论-布罗德本特]]和[[衰减理论-特瑞斯曼]]。\n- 狭义上指过滤器理论"},{"id":"Stroop效应","label":"Stroop效应","level":4,"chars":8,"keywords":["Stroop效应","Stroop"],"parent":"后期选择理论-多伊奇","group":"注意的相关理论","related":[],"summary":"笔记正文仅标题行：Stroop 效应（无展开）","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"**Stroop**效应"},{"id":"认知过程类型-卡尼曼","label":"认知过程类型-卡尼曼","level":4,"chars":10,"keywords":["认知过程类型-卡尼曼","资源限制过程","材料限制过程"],"parent":"认知资源理论","group":"注意的相关理论","related":[],"summary":"认知过程类型： 1. 资源限制过程； 2. 材料限制过程","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"认知过程类型：\n1. 资源限制过程；\n2. 材料限制过程\n\n- **资源限制**：成绩差是因为“注意不够”，加资源能改善。\n- **材料限制**：成绩差是因为“信息不行”，加资源也没用。\n\n所以，卡尼曼的资源分配理论主要解释**资源限制过程**；而**材料限制过程**说明，并非所有任务都能靠投入更多注意来提高成绩。\n\n两者不是任务固定标签，同一任务在不同条件下可能从资源限制变成材料限制，或反过来。"},{"id":"分配认知资源理论的影响因素","label":"分配认知资源理论的影响因素","level":4,"chars":13,"keywords":["分配认知资源理论的影响因素","可用能量","能量需求评估","个人长期倾向"],"parent":"认知资源理论","group":"注意的相关理论","related":[],"summary":"1. 可用能量 2. 能量需求评估 3. 个人长期倾向 4. 当前意愿","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"1. 可用能量\n2. 能量需求评估\n3. 个人长期倾向\n4. 当前意愿"},{"id":"NREM睡眠","label":"NREM睡眠","level":5,"chars":6,"keywords":["NREM睡眠","NREM"],"parent":"睡眠的阶段","group":"意识的分类","related":["睡眠的三四阶段","睡眠的第一阶段","睡眠的第二阶段"],"summary":"子卡片：睡眠的第一阶段、睡眠的第二阶段、睡眠的三四阶段","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"## ![[睡眠的第一阶段]]\n\n## ![[睡眠的第二阶段]]\n\n## ![[睡眠的三四阶段]]"},{"id":"快速眼动阶段-REM","label":"快速眼动阶段-REM","level":5,"chars":10,"keywords":["快速眼动阶段-REM","快速眼动睡眠","梦境"],"parent":"睡眠的阶段","group":"意识的分类","related":[],"summary":"快速眼动睡眠（REM）通常伴随 梦境 出现。睡眠者眼球快速运动，心律和血压变得不规则，呼吸急促，肌肉依然松软","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"快速眼动睡眠（REM）通常伴随**梦境**出现。睡眠者眼球快速运动，心律和血压变得不规则，呼吸急促，肌肉依然松软。在一个睡眠周期中，大多数的REM发生于睡眠后期，持续时间也越来越长（*第一次 REM约5-10 min，最后一次则长达1 h*）；而在人的一生中，随年龄增长，REM时间**逐渐缩短**。若剥夺人的REM并让其重新入睡，则REM通常会**增加**。\u003cbr>REM阶段，脑电活动迅速改变，**δ**波消失，**高频低幅**的脑电波出现，与个体在**清醒**状态时的脑电活动相似\n\n![[梦的理论解释]]"},{"id":"睡眠的第一阶段","label":"睡眠的第一阶段","level":5,"chars":7,"keywords":["睡眠的第一阶段","第一阶段","浅睡状态","混合波"],"parent":"睡眠的阶段","group":"意识的分类","related":["NREM睡眠"],"summary":"第一阶段10min 浅睡状态； 低频低幅 混合波","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"第一阶段10min\n浅睡状态；\n**低频低幅**混合波；"},{"id":"睡眠的第二阶段","label":"睡眠的第二阶段","level":5,"chars":7,"keywords":["睡眠的第二阶段","第二阶段","纺锤波"],"parent":"睡眠的阶段","group":"意识的分类","related":["NREM睡眠"],"summary":"睡眠的阶段 下的子节点：第二阶段以纺锤波（睡眠锭）为标志（该笔记只有标题）","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"较难唤醒；\n**睡眠锭**(短暂爆发，**高频高幅**)"},{"id":"睡眠的三四阶段","label":"睡眠的三四阶段","level":5,"chars":7,"keywords":["睡眠的三四阶段","SWS","慢波睡眠","δ波"],"parent":"睡眠的阶段","group":"意识的分类","related":["NREM睡眠"],"summary":"第三（四)阶段：40min 慢波睡眠(SWS) ； 低频高幅 ； 大多数为δ波→深度睡眠； 梦呓、梦游、尿床","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"第三（四)阶段：40min\n**慢波睡眠(SWS)**；**低频高幅**；\n大多数为δ波→深度睡眠；\n梦呓、梦游、尿床\n\n![[老教材关于睡眠三四阶段的说法]]"},{"id":"失眠的原因","label":"失眠的原因","level":5,"chars":5,"keywords":["失眠的原因","压力","精神失调"],"parent":"失眠-失眠症","group":"意识的分类","related":[],"summary":"1. 压力 2. 精神失调","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"1. 压力\n2. 精神失调"},{"id":"应对失眠的办法","label":"应对失眠的办法","level":5,"chars":7,"keywords":["应对失眠的办法","安眠药","药物治疗"],"parent":"失眠-失眠症","group":"意识的分类","related":[],"summary":"因为失眠首先需要分析原因然后针对性的考虑对策考虑是使用药物治疗（安眠药）还是非药物治疗（ ）","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"因为失眠首先需要分析原因然后针对性的考虑对策考虑是使用药物治疗（安眠药）还是非药物治疗（[[认知行为疗法]]）"},{"id":"特殊状态理论","label":"特殊状态理论","level":5,"chars":6,"keywords":["特殊状态理论","希尔加德","意识分离理论"],"parent":"催眠的相关理论","group":"意识的分类","related":[],"summary":"催眠状态是一种特殊的意识状态。 - 代表性理论： 希尔加德 提出 意识分离理论 ，认为在催眠状态下","attrs":{"theory":["特殊状态理论"],"psychologist":["希尔加德"],"experiment":[]},"body":"- 催眠状态是一种特殊的意识状态。\n- 代表性理论：**希尔加德**提出**意识分离理论**，认为在催眠状态下，人的意识功能会分离为2个层面：\n\t- 第一层面，在催眠师的暗示下产生，可能扭曲或不完整，个体会自愿执行催眠师的指令\n\t- 第二层面，隐藏在第一个层面之后，如同一个隐藏的观察者，能够知道真实发生的事情"},{"id":"非特殊状态理论","label":"非特殊状态理论","level":5,"chars":7,"keywords":["非特殊状态理论","斯帕诺斯","角色扮演"],"parent":"催眠的相关理论","group":"意识的分类","related":[],"summary":"反对把催眠看成特殊意识状态，认为催眠是一种 正常的基本心理过程","attrs":{"theory":["非特殊状态理论"],"psychologist":["斯帕诺斯"],"experiment":[]},"body":"- 反对把催眠看成特殊意识状态，认为催眠是一种**正常的基本心理过程。**\n- 代表性理论：**斯帕诺斯**提出**角色扮演**理论，认为催眠反映的是催眠师和被催眠者之间所扮演的**社会角色关系**，被催眠者只是扮演了一个特殊的社会角色\""},{"id":"正念","label":"正念","level":5,"chars":2,"keywords":["正念","正念冥想","非评判性"],"parent":"冥想","group":"意识的分类","related":[],"summary":"又称正念冥想，其特点是个体全身心地关注自己当下的体验，并对体验持一种 非评判性的接受 态度","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"正念：又称正念冥想，其特点是个体全身心地关注自己当下的体验，并对体验持一种**非评判性的接受**态度。所谓**非评判性**，是指不评判此时此刻的体验的好坏，而将所有的当下体验当作\"\"是什么\"\"来接受。"},{"id":"梦的理论解释","label":"梦的理论解释","level":6,"chars":6,"keywords":["梦的理论解释","梦的解释","梦的理论"],"parent":"快速眼动阶段-REM","group":"意识的分类","related":[],"summary":"梦是一种特殊的意识状态，是睡眠时的一种意象语言，其主要特点是 ①无意性 、 ②被动性 及 ③梦境的离奇与怪诞","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"梦是一种特殊的意识状态，是睡眠时的一种意象语言，其主要特点是**①无意性**、**②被动性**及**③梦境的离奇与怪诞**，做梦时脑波变化与**清醒**时相似\n1. ![[精神分析对梦的解释]]\n2. ![[生理心理学对梦的解释-激活-整合假设]]\n3. ![[认知心理学对梦的解释]]\n\n![[梦的研究工具-夜晚帽]]"},{"id":"老教材关于睡眠三四阶段的说法","label":"老教材关于睡眠三四阶段的说法","level":6,"chars":14,"keywords":["老教材关于睡眠三四阶段的说法","老教材说法","90min"],"parent":"睡眠的三四阶段","group":"意识的分类","related":[],"summary":"老教材：第三阶段易被唤醒、身体瘫痪、多梦；第四阶段深睡难醒","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"**老教材说法**\n睡眠第三阶段**脑电波激活、身体瘫痪、大多数梦发生于此、易被唤醒**功能：恢复情绪和认知做梦：**大多数梦**\n\n睡眠第四阶段（深度睡眠 / 慢波睡眠）即**深度睡眠**阶段，个体很难被唤醒，肌肉进一步放松，身体功能的各项指标下降，有时发生**什么行为梦游、梦呓、尿床**等。**深度睡眠**的时间在前半夜远多于后半夜。此时，脑电几乎完全为频率低、波幅大的**δ波型**波。\n第三、第四阶段的睡眠通常被称为\"\"**慢波睡眠（SWS）别称**\"\"。此阶段不易唤醒，若被叫醒会感到头昏脑胀。当黎明临近时，**慢波睡眠阶段**会逐渐消失。前四个阶段的睡眠大约需要**90min**，*之后睡眠由深入浅，再次进入第三阶段和第二阶段*。这时睡眠者通常会有翻身的动作，并很容易惊醒。接着进入**快速眼动睡眠（REM）下一阶段**阶段\""},{"id":"认知行为疗法","label":"认知行为疗法","level":6,"chars":6,"keywords":["认知行为疗法","CBT","非药物治疗"],"parent":"应对失眠的办法","group":"意识的分类","related":[],"summary":"应对失眠的办法 下的子节点：认知行为疗法（该笔记只有标题）","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"认知行为疗法\n\n（有待丰富）"},{"id":"精神分析对梦的解释","label":"精神分析对梦的解释","level":7,"chars":9,"keywords":["精神分析对梦的解释","弗洛伊德","显梦与隐梦","潜意识","弗洛依德"],"parent":"梦的理论解释","group":"意识的分类","related":[],"summary":"弗洛伊德等人提出：梦是潜意识过程的显现，是通向潜意识的最可靠的途径","attrs":{"theory":[],"psychologist":["弗洛伊德"],"experiment":[]},"body":"弗洛伊德等人提出：梦是潜意识过程的显现，是通向潜意识的最可靠的途径，是人冲动和愿望的反映（**性、攻击本能**）可分为显梦（**梦的内容**）和隐梦（**梦的含义**）\n局限性：**比较主观**、**无法验证**\""},{"id":"生理心理学对梦的解释-激活-整合假设","label":"生理心理学对梦的解释-激活-整合假设","level":7,"chars":18,"keywords":["生理心理学对梦的解释-激活-整合假设","激活整合假设","霍布斯","随机神经活动","激活-整合假设","霍布森"],"parent":"梦的理论解释","group":"意识的分类","related":[],"summary":"霍布斯 提出 激活-整合假设 ，认为梦本质是 个体对 大脑随机神经活动 的 主观解释","attrs":{"theory":["激活-整合假设"],"psychologist":["霍布斯"],"experiment":[]},"body":"霍布斯 提出  **激活-整合假设**  ，认为梦本质是  个体对**大脑随机神经活动**的**主观解释**  。一*定水平的刺激对于维持大脑和神经系统的正常功能是必要的*，在睡眠过程中由于外界刺激减少，脑干会自发产生并向大脑皮层发送大量随机的**神经脉冲**，梦便是我们的认知系统试图将这些随机信号组织成一定有意义的梦的过程\n\n**局限性**：  难以解释某些梦境的**高度连贯性**以及**与清醒思维过程的高度相似性**"},{"id":"认知心理学对梦的解释","label":"认知心理学对梦的解释","level":7,"chars":10,"keywords":["认知心理学对梦的解释","福克斯","认知功能"],"parent":"梦的理论解释","group":"意识的分类","related":[],"summary":"认知观点强调 梦承担着一定的认知功能 ，在睡眠中认知系统仍然会对存储的知识进行 检索、排序、整合与巩固","attrs":{"theory":[],"psychologist":["福克斯"],"experiment":[]},"body":"认知观点强调**梦承担着一定的认知功能**，在睡眠中认知系统仍然会对存储的知识进行  **检索、排序、整合与巩固**。  这些活动的一部分会进入意识从而形成梦境，**福克斯**  认为梦的功能就是**将个体的知觉和行为经验重新编码与整合**，使之转化为**符号化的可被意识到的知识**，这种整合能**将新旧记忆联系起来**，可以解释为  *日有所思，夜有所梦*\n**局限性**：  但是他**无法解释**某些梦境的**荒诞和不合逻辑**"},{"id":"梦的研究工具-夜晚帽","label":"梦的研究工具-夜晚帽","level":7,"chars":10,"keywords":["梦的研究工具-夜晚帽","夜晚帽","记忆器"],"parent":"梦的理论解释","group":"意识的分类","related":[],"summary":"对梦相关的研究通常采用 夜晚帽 进行。这是一种帽型仪器，由一些传感换能器和一个微处理器构成，另外还包括一个记忆器","attrs":{"theory":[],"psychologist":[],"experiment":[]},"body":"对梦相关的研究通常采用**夜晚帽**进行。这是一种\"\"帽型\"\"仪器，由一些传感换能器和一个微处理器构成，另外还包括一个记忆器，能够记录个体在梦中的 **脑电变化**及 **眼动情况**\n发现**做梦与快速眼动睡眠的关联**是梦境研究的一个重要里程碑。研究者可以在被试做梦时随时打断他，并让他报告梦境内容，而不是等被试醒来后再报告"}],"edges":{"tree":[["root__chapter","意识的概述"],["root__chapter","意识的分类"],["root__chapter","意识相关理论"],["root__chapter","注意的概述"],["root__chapter","注意的生理机制"],["root__chapter","注意的分类"],["root__chapter","注意的相关理论"],["意识的概述","意识的含义"],["意识的概述","意识的功能"],["意识的分类","非意识"],["意识的分类","前意识"],["意识的分类","无意识"],["意识的分类","意识流"],["意识的分类","焦点意识"],["意识的分类","半意识"],["意识的分类","意识状态"],["意识相关理论","双加工理论"],["注意的概述","注意的含义"],["注意的概述","注意的性质"],["注意的概述","注意的功能"],["注意的概述","注意的品质"],["注意的生理机制","朝向反射"],["注意的生理机制","脑干网状结构"],["注意的生理机制","边缘系统"],["注意的生理机制","大脑皮层"],["注意的分类","注意的分类-线索来源"],["注意的分类","注意的分类-功能"],["注意的相关理论","注意的选择理论（多对一)"],["注意的相关理论","注意的分配理论（一对多）"],["注意的相关理论","特征整合理论"],["无意识","阈下知觉"],["无意识","盲视"],["无意识","视盲"],["无意识","无意识行为"],["意识状态","睡眠"],["意识状态","催眠"],["意识状态","冥想与正念"],["意识状态","大脑清醒状态时的脑波"],["意识状态","大脑处于安静和休息时的脑波"],["双加工理论","自动化加工（前注意加工）"],["双加工理论","受意识控制的加工"],["注意的性质","意识的指向性"],["注意的性质","意识的集中性"],["注意的功能","注意的选择功能"],["注意的功能","注意的维持功能"],["注意的功能","注意的整合功能（调节和监督）"],["注意的品质","注意品质-注意广度"],["注意的品质","注意品质-注意转移"],["注意的品质","注意品质-注意稳定"],["注意的品质","注意品质-注意分配"],["边缘系统","前扣带回（ACC)"],["注意的分类-线索来源","不随意注意（外源性注意）"],["注意的分类-线索来源","随意注意（内源性注意）"],["注意的分类-线索来源","随意后注意（有意后注意）"],["注意的分类-功能","选择性注意（指向）一双耳分听"],["注意的分类-功能","持续性注意（集中）一警戒作业"],["注意的分类-功能","分配性注意（指向+集中）一双作业操作"],["注意的选择理论（多对一)","过滤器理论-布罗德本特"],["注意的选择理论（多对一)","衰减理论-特瑞斯曼"],["注意的选择理论（多对一)","后期选择理论-多伊奇"],["注意的选择理论（多对一)","多阶段选择模型-约翰斯顿"],["注意的分配理论（一对多）","认知资源理论"],["特征整合理论","前注意阶段（特征登记）"],["特征整合理论","特征结合阶段（特征整合)"],["视盲","非注意视盲"],["视盲","变化盲"],["睡眠","睡眠的阶段"],["睡眠","睡眠的功能"],["睡眠","失眠-失眠症"],["睡眠","大脑处于睡眠时的脑波"],["催眠","催眠状态下的心理特征"],["催眠","容易被催眠者的特征"],["催眠","催眠的相关理论"],["冥想与正念","冥想"],["冥想与正念","专注式冥想"],["冥想与正念","开放监控式冥想"],["冥想与正念","冥想和正念的作用"] <script>
/*STARMAP-ENGINE*/
(function () {
  'use strict';

  /* =========================================================
     0. 基础工具
     ========================================================= */
  var TAU = Math.PI * 2;
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function now() { return Date.now(); }
  function perfNow() { return (window.performance && performance.now) ? performance.now() : Date.now(); }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function fmtDur(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    var h = Math.floor(s / 3600); var m = Math.floor((s % 3600) / 60); var ss = s % 60;
    return h > 0 ? (h + ':' + pad2(m) + ':' + pad2(ss)) : (pad2(m) + ':' + pad2(ss));
  }
  /* D5 + C1 规范化：全角转半角 → 转小写 → 去掉「的/了/是」虚词与全部标点空白 */
  function normalize(s) {
    return String(s == null ? '' : s)
      .replace(/[\uFF01-\uFF5E]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
      .replace(/\u3000/g, ' ')
      .toLowerCase()
      .replace(/[的了是]/g, '')
      .replace(/[^\p{L}\p{N}]+/gu, '');
  }
  function angDiff(a, b) { var d = a - b; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  /* =========================================================
     1. 数据读入与图模型
     ========================================================= */
  var RAW;
  try {
    RAW = JSON.parse(document.getElementById('graph-data').textContent);
  } catch (e) {
    document.body.innerHTML = '<pre style="padding:24px;color:#f88">graph-data 解析失败：' + esc(e.message) + '</pre>';
    return;
  }
  var META = RAW.meta || {};
  var NODES = Array.isArray(RAW.nodes) ? RAW.nodes : [];
  var ROOT_ID = RAW.root || (NODES.filter(function (n) { return !n.parent; })[0] || {}).id;
  var byId = new Map();
  var childMap = new Map();
  var parentMap = new Map();
  var relMap = new Map();
  var adjMap = new Map();
  var edgeTree = [];
  var edgeRel = [];

  function pushMap(map, k, v) {
    var arr = map.get(k);
    if (!arr) { arr = []; map.set(k, arr); }
    if (arr.indexOf(v) < 0) arr.push(v);
  }

  (function buildModel() {
    NODES.forEach(function (n) {
      byId.set(n.id, n);
      n.label = String(n.label == null ? '' : n.label);
      n.chars = (typeof n.chars === 'number' && n.chars > 0) ? n.chars : n.label.length || 2;
      n.level = (typeof n.level === 'number' && isFinite(n.level)) ? Math.max(0, Math.round(n.level)) : 0;
      if (!Array.isArray(n.keywords)) n.keywords = [];
      if (!Array.isArray(n.related)) n.related = [];
      /* 属性字段（笔记 frontmatter 的 theory / psychologist / experiment）：防御式补成数组 */
      if (!n.attrs || typeof n.attrs !== 'object') n.attrs = {};
      ['theory', 'psychologist', 'experiment'].forEach(function (k) {
        if (!Array.isArray(n.attrs[k])) n.attrs[k] = [];
      });
      childMap.set(n.id, []);
      relMap.set(n.id, new Set());
      adjMap.set(n.id, []);
    });
    var raw = (RAW.edges || {});
    var pairs = [];
    var seen = new Set();
    (Array.isArray(raw.tree) ? raw.tree : []).forEach(function (p) {
      if (Array.isArray(p) && p[0] !== p[1] && byId.has(p[0]) && byId.has(p[1])) {
        var k = p[0] + '>' + p[1];
        if (!seen.has(k)) { seen.add(k); pairs.push([p[0], p[1]]); }
      }
    });
    NODES.forEach(function (n) {
      if (n.parent && n.parent !== n.id && byId.has(n.parent)) {
        var k = n.parent + '>' + n.id;
        if (!seen.has(k)) { seen.add(k); pairs.push([n.parent, n.id]); }
      }
    });
    pairs.forEach(function (p) {
      edgeTree.push(p);

    ET.forEach(function (e) { deg[e[0]]++; deg[e[1]]++; });
    ET.forEach(function (e) { BIAS.push(1 / Math.max(1, Math.min(deg[e[0]], deg[e[1]]))); });

    var preX = new Array(N), preY = new Array(N), zeroRun = new Array(N), maxZero = 0, frozenCount = 0;
    for (q = 0; q < N; q++) { preX[q] = NS[q].x; preY[q] = NS[q].y; zeroRun[q] = 0; }

    var CUT = FREE_REPEL_CUT, CHG = FREE_REPEL;
    var mvLast = [], drift = 0;
    for (t = 0; t < FREE_ITERS; t++) {
      var alpha = 1 - t / FREE_ITERS;
      for (q = 0; q < N; q++) { preX[q] = NS[q].x; preY[q] = NS[q].y; }
      /* a) 全局斥力：d < CUT 的点对互推开，越近推力越大（远距离完全收手，省算力也保骨架） */
      for (i = 0; i < N; i++) {
        var A = NS[i];
        for (j = i + 1; j < N; j++) {
          var B = NS[j];
          var dx = A.x - B.x, dy = A.y - B.y;
          var d = Math.sqrt(dx * dx + dy * dy);
          if (d >= CUT) continue;
          if (d < 1e-3) { dx = 1e-3 * (i + 1); dy = 1e-3; d = Math.sqrt(dx * dx + dy * dy); }
          var rel = (CUT - d) / CUT;
          var f = CHG * alpha * rel * rel / d;
          A.x += dx * f; A.y += dy * f;
          B.x -= dx * f; B.y -= dy * f;
        }
      }
      /* b) 树边弹簧：目标长度 250，度高的节点让位少一些 */
      for (q = 0; q < ET.length; q++) {
        var EA = NS[ET[q][0]], EB = NS[ET[q][1]];
        var ex = EB.x - EA.x, ey = EB.y - EA.y;
        var ed = Math.sqrt(ex * ex + ey * ey); if (ed < 1e-3) ed = 1e-3;
        var sf = (ed - DIST) / ed * 0.5 * alpha * OBS_LINK * FREE_SPRING * BIAS[q];
        EA.x += ex * sf; EA.y += ey * sf;
        EB.x -= ex * sf; EB.y -= ey * sf;
      }
      /* c) 弱径向弹簧：只把「到根距离」轻拽向 250·L（刚度极小，不是环带、不做限位） */
      for (q = 0; q < N; q++) {
        if (q === ROOTIX) continue;
        var RA = NS[q];
        var rr2 = Math.sqrt(RA.x * RA.x + RA.y * RA.y);
        if (rr2 < 1e-6) continue;
        var rf = FREE_RADIAL * alpha * (DIST * RA.lv - rr2);
        RA.x += RA.x / rr2 * rf; RA.y += RA.y / rr2 * rf;
      }
      /* d) 根硬钉原点 */
      if (ROOTIX >= 0) { NS[ROOTIX].x = 0; NS[ROOTIX].y = 0; }
      /* 位移统计：证明节点是活的、没有被夹死 */
      for (q = 0; q < N; q++) {
        var mvx = NS[q].x - preX[q], mvy = NS[q].y - preY[q];
        var mv = Math.sqrt(mvx * mvx + mvy * mvy);
        if (mv < 1e-9) zeroRun[q]++; else zeroRun[q] = 0;
        if (zeroRun[q] > maxZero) maxZero = zeroRun[q];
      }
      var mx = 0;
      for (q = 0; q < N; q++) {
        var ax2 = NS[q].x - preX[q], ay2 = NS[q].y - preY[q];
        var av = Math.sqrt(ax2 * ax2 + ay2 * ay2);
        if (av > mx) mx = av;
      }
      mvLast.push(mx);
      if (mvLast.length > 20) mvLast.shift();
    }
    drift = mvLast.length ? Math.max.apply(null, mvLast) : 0;
    for (q = 0; q < N; q++) if (q !== ROOTIX && zeroRun[q] >= 5) frozenCount++;

    /* ④b 收尾：只收敛「世界最小圆心距 ≥ LAYOUT_MIN_D」这一条几何约束（软推，不做边界处理） */
    function collidePass(tgt, k2) {
      for (var cp2 = 0; cp2 < 2; cp2++) {
        for (var i2 = 0; i2 < N; i2++) {
          var C2 = NS[i2];
          for (var j2 = i2 + 1; j2 < N; j2++) {
            var D2 = NS[j2];
            var qx = C2.x - D2.x, qy = C2.y - D2.y;
            var qd = Math.sqrt(qx * qx + qy * qy);
            if (qd >= tgt) continue;
            if (qd < 1e-3) { qx = 1e-3 * (i2 + 1); qy = 1e-3; qd = Math.sqrt(qx * qx + qy * qy); }
            var pw = (tgt - qd) * 0.5 * k2;
            C2.x += qx / qd * pw; C2.y += qy / qd * pw;
            D2.x -= qx / qd * pw; D2.y -= qy / qd * pw;
          }
        }
        if (ROOTIX >= 0) { NS[ROOTIX].x = 0; NS[ROOTIX].y = 0; }
      }
    }
    function minPairNow() {
      var mp = Infinity, ia = 0, ib = 0;
      for (var i3 = 0; i3 < N; i3++) for (var j3 = i3 + 1; j3 < N; j3++) {
        var ex2 = NS[i3].x - NS[j3].x, ey2 = NS[i3].y - NS[j3].y;
        var ed2 = Math.sqrt(ex2 * ex2 + ey2 * ey2);
        if (ed2 < mp) { mp = ed2; ia = i3; ib = j3; }

      return { d: mp, a: ia, b: ib };
    }
    var settleRounds = 0, mpFinal = 0, hardOvershoot = 0;
    var tgtMp = MIND * FREE_COLLIDE;
    for (var sr = 0; sr < FREE_COLLIDE_ITERS; sr++) {
      collidePass(tgtMp, 0.85);

      mpFinal = minPairNow().d;
